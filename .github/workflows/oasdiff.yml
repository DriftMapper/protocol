name: oasdiff

# Gates on oasdiff breaking-change detection against the previous release
# tag (spec §5.1b) — not against main's HEAD, since the compatibility
# window is a promise about published versions. A breaking change under
# review that hasn't shipped yet isn't a compatibility violation.
on:
  pull_request:
    branches: [main]
    paths:
      - openapi.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve previous release tag
        id: prev-tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "No previous release tag found; nothing to diff against yet."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # dashboard-tier operations (x-stability: dashboard) are free to change
      # without a version bump (openapi.yaml's compatibility policy) — the
      # public tier alone is what this gate must hold to N-2 compatibility.
      # oasdiff's own --filter-extension can't express a value-based split
      # like this (matches extension *name*, not an x-stability *value*), so
      # scripts/strip_dashboard_tier.py removes dashboard-tier paths from
      # each side of the diff independently, using each file's own
      # x-stability values, before oasdiff ever sees them. See that script's
      # docstring for why a marker-extension approach was tried and rejected.
      #
      # Stripped files are written inside the checked-out workspace, not
      # /tmp: oasdiff/oasdiff-action runs as a Docker action, and only the
      # workspace is guaranteed to be mounted into its container.
      - name: Strip dashboard-tier paths before diffing
        if: steps.prev-tag.outputs.skip == 'false'
        run: |
          pip install --quiet pyyaml
          git show '${{ steps.prev-tag.outputs.tag }}:openapi.yaml' > base-full.yaml
          python3 scripts/strip_dashboard_tier.py base-full.yaml base-public.yaml
          python3 scripts/strip_dashboard_tier.py openapi.yaml revision-public.yaml
          rm base-full.yaml

      # err-ignore/warn-ignore: a small, deliberately narrow escape hatch —
      # oasdiff's breaking-change checks flag any removal as breaking
      # regardless of prior `deprecated: true` annotation (deprecation is a
      # signal to consumers, not something that changes whether removal is
      # wire-breaking), so there is no deprecation-aware flag that makes this
      # pass on its own. Each ignored line is a literal method+path plus the
      # exact change description (case-insensitive substring match) — see the
      # files themselves for what's ignored and why.
      #
      # Two, and only two, sanctioned reasons to add a line here:
      #   1. Deprecate-then-remove-after-N-2 (DRFT-84/85 is the first use):
      #      the field/operation was marked `deprecated: true` in an earlier
      #      release, the N-2 window has since closed, and no installed
      #      client could depend on it anymore.
      #   2. Pre-launch removal with the same "no installed client could
      #      depend on this" conclusion, reached without a deprecation cycle
      #      because the feature is being cut outright, not superseded
      #      (DRFT-124/126 is the first use) — safe only pre-launch, while
      #      "no production customers" is still true; stop using this
      #      justification once that stops holding.
      #   3. Pre-launch response-contract loosening (relaxation, not removal)
      #      where the loosened fields remain always-present on the existing
      #      operation's actual wire behavior, and the relaxed schema is only
      #      reachable through a newly added operation no installed client can
      #      call (DRFT-129 is the first use: `Build` is shared with the new
      #      `registerDeclaredBuild`, while `registerBuild` responses still
      #      always carry repository_id/visibility/ref/workflow). Safe only
      #      pre-launch, same as reason 2 — stop once the product has launched.
      # Never broaden either into a pattern that could swallow an unrelated
      # future breaking change, and never add a line here just because a
      # removal is inconvenient to gate on.
      - uses: oasdiff/oasdiff-action/breaking@v0
        if: steps.prev-tag.outputs.skip == 'false'
        with:
          base: 'base-public.yaml'
          revision: 'revision-public.yaml'
          fail-on: WARN
          err-ignore: '.github/workflows/oasdiff-ignore-err.txt'
          warn-ignore: '.github/workflows/oasdiff-ignore-warn.txt'
          github-token: ${{ github.token }}
