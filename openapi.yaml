openapi: 3.1.0

info:
  title: Driftmapper API
  version: 1.0.0
  summary: Build-info registration, resolution, and drift detection.
  description: |
    Source of truth for the Driftmapper wire contract. Go types (`oapi-codegen`,
    types-only) and TypeScript types (`openapi-typescript`) are generated from this
    file; neither is hand-maintained. See spec §5.1b.

    ## Stability tiers

    This document describes one API with two stability tiers. The tier is declared
    per-operation via `x-stability`.

    - `x-stability: public` — the CLI-facing contract. Published in the
      `driftmapper-protocol` Go module, semver'd on this document's version, and
      covered by the compatibility window below. CI pipelines pin CLI versions and
      are never force-upgraded, so these operations must remain backward compatible
      for years.
    - `x-stability: dashboard` — consumed only by the first-party dashboard SPA,
      which deploys in lockstep with the server. Types are generated into the SPA but
      NOT published in the public Go module. Free to change without a major version.

    **The public tier is exactly three operations: `registerBuild`,
    `recordDeployment` and `authorizeRepository`.** The CLI is a CI-pipeline
    tool — it writes a build and generates an HTML file from the response, and
    it records that a build is now in an environment. `authorizeRepository` is a
    deliberate exception (spec §4.5): redeeming a challenge to bind a
    repository is itself a write (a policy is created), called from the same
    customer CI the CLI already runs in, with the same permanent version-skew
    exposure as build registration. `recordDeployment` is public for the same
    reason: it is called from customer CI, so its version skew is permanent from
    day one. Every other operation is `dashboard`.

    Every registered build comes from a CI pipeline: the CI provider's OIDC
    token is the only credential that can register one (DRFT-165 removed the
    person-registered `registerDeclaredBuild`, which put unproven repository
    names beside proven ones). A build no trusted pipeline produced is simply
    not registered.

    (DRFT-124 removed the first deploy-marking/verification operations —
    `recordDeployment`, `getCurrentDeployment`, `getDeployment`,
    `recordVerification` — from this tier. DRFT-183/185 brings back one of them
    in a narrower shape: `recordDeployment` is a CI-reported record that a build
    is in an environment, with the time set by the server. It is a claim by the
    pipeline, not verification of what is running; there is no verification
    operation.)

    This is deliberately conservative rather than a judgement that these operations
    will never be CLI-facing; a fully featured CLI is an intended later iteration.
    Promoting an operation from `dashboard` to `public` later is additive and safe.
    Demoting one is a breaking change to a contract already pinned in customer CI,
    which is not. When in doubt, an operation starts `dashboard`.

    ## Compatibility policy

    The server supports the current major version and the two preceding majors (N-2)
    for `public` operations. Within a major version, only additive changes are
    permitted: new optional request fields, new response fields, new enum members in
    response-only positions. CI gates on `oasdiff` breaking-change detection against
    the previous tag, scoped to `public`-tier operations only — `dashboard`-tier
    paths are stripped from both sides of the diff before `oasdiff` runs (see
    `.github/workflows/oasdiff.yml` and `scripts/strip_dashboard_tier.py`), since
    that tier is explicitly exempt from this compatibility window.

    Clients MUST ignore unknown response fields. Servers MUST reject unknown request
    body fields (see the `unknown_field` error code below) rather than silently
    dropping them — silent drops turn a client bug into missing data discovered
    months later.

    Pre-launch only, the additive-only rule admits a narrow set of recorded
    exceptions, each justified line-by-line in
    `.github/workflows/oasdiff-ignore-err.txt` rather than silently waved through
    (DRFT-124/126's operation removals; DRFT-129's loosening of `Build` to share it
    with `registerDeclaredBuild`, and DRFT-165's removal of that operation and
    re-tightening of `Build`, where the `registerBuild` wire behavior is unchanged).
    Once the product has launched, no new exceptions are sanctioned — see that
    file's header.

    ## Response envelope

    Every response is one JSON object with exactly one of `data`/`error` set —
    never both, never neither:

    - **Success**: `{"data": <schema>}`. `data` is the operation's documented
      response schema (a resource, or `{"data": [...], "page": {...}}` for a
      paginated list, itself nested inside the outer `data`).
    - **Failure**: `{"error": {"code", "message", "details"}}`, always
      `Content-Type: application/json` (never `application/problem+json` — this
      is a from-scratch envelope, not RFC 9457). `code` is the stable,
      machine-readable identifier clients branch on; `message` is a human-
      readable string that may be reworded without a version bump; `details` is
      present only for errors with structured, error-specific fields a client
      can act on (e.g. `claim_mismatch`'s `mismatched_claim`/`expected`/
      `actual` — spec §4.5, or `rate_limited`'s `scope`/`limit`/
      `retry_after_seconds`) and is absent otherwise. See the `Error` schema.

    ## Authentication

    Two principals, deliberately non-interchangeable (spec §5.2a):

    - `workloadOidc` — a machine principal. The raw OIDC ID token issued by the CI
      provider, presented as a bearer credential. No Driftmapper-issued static token
      exists anywhere in this system (spec §4). This principal reaches exactly the
      `registerBuild`, `recordDeployment` and `authorizeRepository` operations.
    - `userSession` — a human principal, via the WorkOS AuthKit session cookie
      (spec §4A) for the dashboard SPA, or a bearer access-token JWT minted by
      the device-code login (DRFT-30); the server does not distinguish which
      minted it. It reads and manages; it can never register a build.

    A workload principal can never reach billing or membership operations: a
    compromised CI workflow must not be able to cancel a subscription or add an
    org member.

    ## Not described here

    The `build-info.html` meta-tag format is also a public contract with third-party
    parsers, but it is not API-shaped. It is versioned separately in
    `FORMAT-build-info.md` in this repository (spec §2.3).

    The resolution page (`/r/{buildInstanceId}`) is server-rendered HTML, not a JSON
    endpoint (spec §2.7). Its two disclosure tiers correspond exactly to the
    `BuildPublic` and `Build` schemas below.

servers:
  - url: https://api.driftmapper.io
    description: Production

security:
  - userSession: []

tags:
  - name: auth
    description: |
      Dashboard SPA sign-in and account session management. All `dashboard`-
      tier: the CLI authenticates with `workloadOidc`, never these.
  - name: builds
    description: Build registration and lookup.
  - name: deployments
    description: |
      Records, reported by CI, that a build is now in an environment, and the
      history those records form. A deployment record is a claim by the pipeline;
      the server sets its time.
  - name: repos
    description: |
      Repository authorization — binding a repository to an org via
      challenge redemption (spec §4.5), and listing already-bound repos.
  - name: orgs
    description: |
      Organization membership/switching for the signed-in user — which orgs they
      belong to and at what role. Distinct from `billing`, which covers a single
      already-resolved org's plan.
  - name: groups
    description: |
      Admin-only management of an organization's groups and their members
      (WorkOS native groups plus the built-in Everyone group). Groups are the
      unit that later grants access to apps.
  - name: billing
    description: Subscription and checkout.
  - name: admin
    description: |
      Platform-operator-only tooling, gated on `users.is_platform_admin`
      (never org-scoped — see `Forbidden` below, which for these operations
      means "not a platform admin," not "not a member of this org"). Backs
      `cmd/admin`, the thin CLI client that replaced direct DB/WorkOS/Stripe
      access with these bearer endpoints. Publishing the shape here is safe
      and consistent with every other sensitive `dashboard`-tier operation
      (org delete, billing, invites) — the security boundary is authn+authz,
      never obscurity.

paths:
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current WorkOS session
      description: |
        Revokes the session named by the bearer token's `sid` claim, so it (and
        any refresh token derived from it) stops working immediately rather than
        just expiring naturally.

        Not gated behind authentication in the usual sense: a missing, expired,
        or already-invalid bearer token is not an error here, it is simply
        nothing further to revoke. That keeps the operation idempotent — logging
        out twice, or logging out after the access token has already died, both
        just get a `204`.
      tags: [auth]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Session revoked, or there was none to revoke.

  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Fetch the signed-in user
      tags: [auth]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/account/email-notifications:
    patch:
      operationId: updateEmailNotifications
      summary: Enable or disable account email notifications
      description: |
        The only account field mutable through this API. Email address,
        password, and verification status are WorkOS-owned — managed via
        AuthKit itself, not here.
      tags: [auth]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204':
          description: Updated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/builds:
    post:
      operationId: registerBuild
      summary: Register a build and receive its build-instance ID
      description: |
        Called by the CLI during CI. Authenticated with a workload OIDC token only —
        a human session cannot register builds, because build provenance derives
        entirely from verified token claims.

        **Verified from the token, confirmed if also submitted (spec §2.2a,
        DRFT-129, DRFT-182).** Repository ID, repository visibility, workflow, run
        ID, and run attempt are read exclusively from verified claims — there is no
        request field for any of them, and supplying one is rejected with
        `unknown_field`. `commit_sha` and `trigger_event` are read from the token
        too, when the issuer's token carries them (GitHub Actions: `sha` and
        `event_name`); a request that also submits one is *confirmed* against the
        token and rejected with `claim_mismatch` on any difference. `repository` is
        confirmed the same way. A valid token can therefore only ever register
        builds for the repository it actually belongs to, and a value the token
        proves is never taken on the body's word. A value the token does not carry
        (for an issuer that lacks it) is taken from the body; a registration with
        no commit SHA from either source is rejected.

        What the token cannot prove stays declared by the pipeline: `commit_author`,
        `commit_committer`, `built_at` and custom `metadata`.

        **Identity and idempotency (DRFT-188).** A build is a module at a commit. An
        app is made of modules; a module lives in one repository, and a repository can
        hold several modules. The build-instance ID is derived from the module and
        `commit_sha`, so registering the same module at the same commit again — a
        retry or a re-run — returns the existing build with `200`. The run, attempt
        and workflow of each registration are kept as history on the build. Two
        modules registered from one run get two builds. This assumes deterministic
        builds: the same commit produces the same artifact.

        `app` and `module` name what is being registered. Both are created the first
        time CI registers them. A module is bound to the repository that first
        registered it; another repository registering the same module is rejected
        with `claim_mismatch`.

        Registration requires the repository to already carry a live trusted-
        workload policy (spec §4.5) — bind the repository first via
        `authorizeRepository`, then register builds. A token for a repository
        with no live policy is rejected with `error.code: no_live_policy`.

        **This response is the CLI's only template input.** `build_instance_id` and
        `resolution_url` are both server-provided, and the CLI constructs no URLs and
        derives no values of its own when writing `build-info.html`. That keeps the
        generation step a pure function of one response — testable against a fixture
        with no server, and incapable of drifting from server routing.
      tags: [builds]
      x-stability: public
      security:
        - workloadOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRegistration'
      responses:
        '201':
          description: Build registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildResponse' }
        '200':
          description: |
            Identical build already registered; existing record returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Token is signature-valid but not authorized to register this build.
            Includes the claim-mismatch case, which names the specific mismatched
            field rather than failing generically (spec §4.5), reported via
            `error.code: claim_mismatch` with the mismatched field under
            `error.details` — see `ClaimMismatchDetails`. A previously bound
            repository whose policy was revoked reports `error.code: policy_revoked`.
            A repository with no live policy at all — never bound, or never
            reached `authorizeRepository` — reports `error.code: no_live_policy`;
            the message points the caller at the challenge/registration flow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/deployments:
    post:
      operationId: recordDeployment
      summary: Record that a build is now in an environment
      description: |
        Called by the CLI from the CI job that deploys. Authenticated with a workload
        OIDC token only, like `registerBuild`. The record is a **claim by the
        pipeline** that the build is now in the environment; nothing here checks what
        is actually running.

        **What is recorded.** A build (a module at a commit, see `registerBuild`) in
        an environment of its app. Records are append-only: a correction is a new
        record, never an edit. "What is in an environment now" is the newest record
        and is never stored separately. The time is set by the server on receipt; a
        client cannot send one, because a skewed runner clock would otherwise pin
        "current" to the wrong build permanently. Supplying a time field is rejected
        with `unknown_field`.

        **Which build.** `app` and `module` default exactly as in `registerBuild`.
        The build is identified by `build_instance_id` when given, or by
        `commit_sha`, or, when neither is given, by the commit in the verified token
        (GitHub Actions: `sha`). `build_instance_id` and `commit_sha` are mutually
        exclusive. The build must already be registered: a deploy job that follows
        the build job in the same pipeline always satisfies this. Send
        `build_instance_id` or `commit_sha` when the deploy runs in a workflow whose
        token commit is not the commit being deployed, for example a promotion, a
        `workflow_dispatch`, or a `workflow_run`. The ID is in `build-info.html`; how
        it reaches the deploy job is the pipeline's plumbing.

        **Who may record.** The token's repository must be the repository the module
        is bound to. Another repository, such as a separate infrastructure repository,
        is rejected with `claim_mismatch` (`mismatched_claim: module`). The repository
        must also carry a live trusted-workload policy, as for `registerBuild`.

        **Environments** belong to an app and are created the first time one is
        recorded. A name is 1 to 63 characters: lowercase letters, digits and
        hyphens, starting and ending with a letter or digit. Anything else is
        rejected, not normalized, so `Prod` and `prod` can never become two
        environments. When the token carries an environment (GitHub Actions:
        `environment`), that is the environment: `environment` may then be omitted,
        and a value that differs is rejected with `claim_mismatch`
        (`mismatched_claim: environment`). When the token carries none,
        `environment` is required.

        Recording the same build in the same environment from the same run, attempt
        and workflow again returns the existing record with `200`. A new run or
        attempt records again with `201`, so a rollback or redeploy shows in the
        history.
      tags: [deployments]
      x-stability: public
      security:
        - workloadOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentRequest'
      responses:
        '201':
          description: Deployment recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '200':
          description: |
            Already recorded for this run, attempt and workflow; the existing record
            is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Token is signature-valid but not authorized to record this deployment:
            `claim_mismatch` (see `ClaimMismatchDetails`), `policy_revoked`, or
            `no_live_policy`, as for `registerBuild`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            Well-formed but not recordable: an invalid environment name, both
            `build_instance_id` and `commit_sha`, a malformed `url`, or no registered
            build for the module at that commit (`error.code: build_not_registered`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/builds/{buildInstanceId}:
    parameters:
      - $ref: '#/components/parameters/BuildInstanceId'
    get:
      operationId: getBuild
      summary: Fetch one build by its build-instance ID
      description: |
        **Not implemented, and not to be implemented flat (DRFT-176).** A build is
        visible only to callers who can access its app, so a build id alone cannot be
        authorized; a single-build read belongs under `/v1/orgs/{slug}/apps/{appID}/builds`.
        Kept only until the dashboard stops referencing it.

        This is the JSON equivalent of the authenticated tier of the resolution page.
        There is no unauthenticated variant of this endpoint: the public tier exists
        only as server-rendered HTML and OG tags (spec §2.7).
      tags: [builds]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Build detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/repositories/authorize:
    post:
      operationId: authorizeRepository
      summary: Redeem a challenge to bind a repository to an organization
      description: |
        Called by the CLI during CI, immediately before (or as part of)
        `registerBuild` — see `driftmapper/cli`'s `register` command.
        Authenticated with a workload OIDC token only, exactly like
        `registerBuild`: a human session can never bind a repository by
        itself, only a real CI token can (spec §4.5).

        In one atomic transaction: verifies the token, looks up the challenge
        by its presented value, resolves the issuing org, creates a
        trusted-workload policy from the **token's** claims (never the
        request body), and burns the challenge. All of it commits or none
        does — there is no window in which a challenge is consumed without a
        resulting policy, or vice versa. Repository binding is unlimited and
        unmetered on every plan (DRFT-72/117) — there is no plan check here.

        **Repository identity comes only from the verified token.** The
        request carries nothing but the challenge value itself.

        **Error responses never let a caller distinguish "this challenge
        value never existed" from "it existed but is no longer usable"**
        (expired, revoked, already redeemed, or over its attempt cap) — all
        of those collapse to the same `invalid_challenge` `403`. A caller
        that redeems the same already-consumed challenge again — e.g. a
        repo secret left in place after a successful first bind — gets this
        identical response; it cannot be distinguished from a value that was
        never valid. See `driftmapper/cli`'s docs for the operational
        implication (the CLI logs a one-time reminder to remove the secret
        on first successful redemption, rather than relying on repeat calls
        being silently safe).
      tags: [repos]
      x-stability: public
      security:
        - workloadOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryAuthorizeRequest'
      responses:
        '201':
          description: Challenge redeemed; repository now bound to the org.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryAuthorizationResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `error.code: invalid_challenge` — the challenge is unusable, for
            any of the reasons described above, deliberately indistinguishable
            from each other.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `error.code: repository_already_bound` — the token's repository
            already has a live policy bound to a different organization.
            Explicit conflict, not a silent no-op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            `error.code: rate_limited` — too many redemption attempts.
            Distinct from the per-account challenge-issuance limit. See
            `RateLimitDetails` for the `error.details` shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/orgs:
    post:
      operationId: createOrg
      summary: Create an organization
      description: |
        Creates a new, non-personal organization via the WorkOS API and adds the
        caller as its `owner` — distinct from the personal org every user already
        has, which is provisioned automatically on first sign-in and never created
        through this endpoint.
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listOrgs
      summary: List the signed-in user's organizations
      description: |
        Every organization the caller is a member of, each with the caller's role
        in it. This is what the dashboard SPA's org context/switcher resolves
        against — not paginated (a user's org count is small by construction: one
        personal org plus however many they've created or been invited to).

        Ordered personal org first, then by creation date ascending.
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The caller's organizations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/orgs/{slug}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: getOrg
      summary: Get one organization
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Organization detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOrg
      summary: Rename an organization
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteOrg
      summary: Delete an organization
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Organization deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/orgs/{slug}/apps/{appID}/builds:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: appID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAppBuilds
      summary: List the builds of one app
      description: |
        Full build detail, so the caller must be able to access the app: an
        admin or owner, or a member in a group the app is granted to. Any other
        caller gets 404, the same as an app that does not exist (DRFT-176). A
        build list that spans apps does not exist; this is the only list of
        builds. Unrelated to `POST /v1/builds` (`registerBuild`), which stays
        flat: a workload OIDC token has no org context at registration time.
      tags: [builds]
      x-stability: dashboard
      security:
        - userSession: []
      parameters:
        - name: repository_id
          in: query
          schema: { type: string }
          description: Filter to one repository.
        - name: module
          in: query
          schema: { type: string }
          description: |
            Filter to one module of the app, by exact name. A repository can hold
            several modules, so this narrows further than `repository_id`. A name the
            app has no module of matches nothing.
        - name: ref
          in: query
          schema: { type: string }
        - name: commit_sha
          in: query
          schema: { type: string }
        - name: registered_after
          in: query
          schema: { type: string, format: date-time }
        - name: registered_before
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of builds, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/apps/{appID}/environments:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: appID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: listAppEnvironments
      summary: What each module of one app is running in each environment
      description: |
        One row per module and environment that has at least one deployment record
        (DRFT-186): the build the newest record names, and when that build last changed.
        The same caller rule as `listAppBuilds`: an admin or owner, or a member in a
        group the app is granted to. Any other caller gets 404, the same as an app that
        does not exist.

        Every row is a **claim by the deploying pipeline** (see `recordDeployment`), not
        a check of what is running. Rows are ordered by module, then environment. A
        module with no records in any environment has no row.

        `running_since` is when the *build* last changed: the time of the first record in
        the unbroken run of records that name the current build. Recording the same build
        again (a redeploy) moves `last_recorded_at` but not `running_since`; recording an
        earlier build again (a rollback) starts a new run, so `running_since` moves.
      tags: [deployments]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The current state of each module and environment of the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentStatesResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/apps/{appID}/matrix:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: appID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getAppMatrix
      summary: Every module of one app against every environment
      parameters:
        - name: baseline
          in: query
          required: false
          description: |
            The baseline to compare against (DRFT-191). Defaults to the app's latest. An id
            that is not one of this app's baselines is a 404.
          schema: { type: integer, format: int64 }
      description: |
        The app's whole grid in one read (DRFT-189): all of its modules, all of its
        environments, and what each module is running in each environment that has a
        record. The same caller rule as `listAppBuilds`: an admin or owner, or a member in
        a group the app is granted to. Any other caller gets 404, the same as an app that
        does not exist.

        `modules` are ordered by name and `environments` in the order they were first
        recorded, which usually follows a pipeline's promotion order. `cells` has one
        `EnvironmentState` for each module and environment that has at least one record,
        in the same shape and with the same meaning as `listAppEnvironments` (including
        `running_since`, when the *build* last changed). A module and environment with no
        record have no cell: nothing has been reported for that pair, which is different
        from having been reported as empty.

        `as_of` is the server's time for the read, so the grid can be dated reliably.
        In each cell `last_recorded_at` is the time of the newest report of any kind, a
        redeploy of the same build included, so a deployment, or a deployment and its
        rollback, during a period always moves it. `running_since` moves only when the
        build changes.

        Unlike `listAppEnvironments`, a module that has been registered but never recorded
        in any environment still appears in `modules`. Every cell is a **claim by the
        deploying pipeline** (see `recordDeployment`), not a check of what is running.

        When the app has a baseline (DRFT-191), `baseline` is the one compared against and
        `drift` has one entry for every module and environment, including the pairs with no
        cell. A pair `match`es when its cell and the baseline name the same build. It
        `differs` in every other case: the environment has no build of the module, the
        baseline has none, or they are different builds. Drift is computed from build
        identity alone, in the same read as the cells. An app with no baseline has neither
        field.
      tags: [deployments]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The app's modules, environments and the cells that have a record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppMatrixResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/apps/{appID}/baselines:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
