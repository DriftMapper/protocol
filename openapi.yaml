        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/apps/{appID}/modules/{module}/environments/{environment}/deployments:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: appID
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: module
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
      - name: environment
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 63 }
    get:
      operationId: listModuleDeployments
      summary: Every deployment record of one module in one environment
      description: |
        The history behind one row of `listAppEnvironments` (DRFT-186), newest first.
        The same caller rule as `listAppBuilds`. An unknown module or environment is 404,
        the same as an app the caller cannot access, so nothing reveals which exist.

        Records are CI-reported claims (see `recordDeployment`), ordered by the time the
        server received them, then by arrival.

        **What was running at a time.** `deployed_before` keeps only records at or
        before that instant, so `deployed_before=<time>&limit=1` is the record in effect
        then: its `build_instance_id`, and `running_since` for how long that build had
        been running. An empty page means nothing had been recorded by then.

        `changed` is true when the record's build differs from the record before it in
        the same module and environment (the first record is always a change).
        `running_since` is the time of the first record in the unbroken run of records
        that name this record's build, so it is the same for a redeploy as for the
        deployment that started the run.
      tags: [deployments]
      x-stability: dashboard
      security:
        - userSession: []
      parameters:
        - name: deployed_before
          in: query
          schema: { type: string, format: date-time }
          description: Only records received at or before this instant.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deployment records, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentRecordListResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

