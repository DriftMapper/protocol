        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/orgs/{slug}/builds:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: listBuilds
      summary: List builds for one organization
      description: |
        Org-scoped by URL, same convention as every other dashboard-tier list in this
        API — there is no session-tracked "current org" a flat path could resolve
        against, and a user may belong to more than one. Unrelated to
        `POST /v1/builds` (`registerBuild`), which stays flat: a workload OIDC token
        has no org/slug context at registration time, and the server resolves the
        owning org from the repository's authorization instead.
      tags: [builds]
      x-stability: dashboard
      security:
        - userSession: []
      parameters:
        - name: repository_id
          in: query
          schema: { type: string }
          description: Filter to one repository.
        - name: ref
          in: query
          schema: { type: string }
        - name: commit_sha
          in: query
          schema: { type: string }
        - name: registered_after
          in: query
          schema: { type: string, format: date-time }
        - name: registered_before
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of builds, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/builds/{buildInstanceId}/deployments:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/BuildInstanceId'
    post:
      operationId: recordDeploymentForBuild
      summary: Tag a build as deployed to an environment (dashboard)
      description: |
        The manual-tagging fallback for deploys that don't originate from
        CLI-integrated CI (spec's deploy-marking design) — lives on the
        existing resolution page (`/r/{buildInstanceId}`), a one-shot
        action rather than a dedicated SPA surface. Human principal only,
        same `OrgScoped` gate shape as `revokePolicy`: Admin/Owner
        required, since this writes to the deployment audit trail on the
        caller's behalf, not just reads it.

        `buildInstanceId` is resolved from the URL, and the build must
        already belong to `slug`'s organization — a build belonging to a
        different org reports the same `404` an unknown build-instance ID
        gets (existence hiding, the same convention every other
        organization-scoped resource in this API uses).

        Shares environment-name validation and server-stamped `created_at`
        with `recordDeployment`, but sits outside that endpoint's dedupe
        index: there is no run identity on this path (no OIDC token), so
        every call inserts a new row and returns `201` — always, never
        `200`, even for an apparent repeat. The differences from the CI
        path are how the repository is resolved (from the build's own
        binding, not a fresh OIDC token), who gets attributed in
        `deployed_by` (`user:<id>` here, versus a workload identity on the
        CI path), and that `run_id`/`run_attempt` are always absent on
        rows this endpoint writes.
      tags: [deployments]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployBuildRequest'
      responses:
        '201':
          description: |
            Deployment recorded. Always `201` on this path — there is no
            run identity to dedupe against, so an apparent repeat still
            inserts a new row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/orgs/{slug}/repos:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: listRepos
      summary: List confirmed repositories for one organization
      tags: [repos]
      x-stability: dashboard
      security:
        - userSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of confirmed repositories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/challenges:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      operationId: createChallenge
      summary: Issue a single-use challenge for this organization
      description: |
        The first step of spec §4.5's onboarding flow: mints a cryptographically
        random, single-use, ~1hr-lived challenge, scoped to this org only —
        it asserts nothing about which repository. The human pastes the
        returned `value` into CI as a `DRIFTMAPPER_CHALLENGE` secret; the
        repository's own OIDC token later proves the rest at redemption
        (`authorizeRepository`).

        **`value` is returned exactly once, on this response only.** It is
        stored server-side as a hash, never recoverable afterward —
        `listChallenges` never includes it. Losing the value before it's
        pasted into CI means issuing a new challenge, not recovering the old
        one.

        Admin+ only, same bar as inviting a member: issuing a challenge is a
        setup action that can bind a new repository to this org.
      tags: [repos]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '201':
          description: Challenge issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeIssuedResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: |
            `error.code: rate_limited` — too many challenges issued for this
            account recently. Distinct from redemption's own rate limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    get:
      operationId: listChallenges
      summary: List this organization's challenges
      description: |
        Lifecycle visibility for challenges issued via `createChallenge` —
        issued-at, expires-at, redemption/attempt state. **Never includes the
        raw value**, issued or not; that's `createChallenge`'s one-time
        response only. Member+, matching read access to every other
        onboarding-adjacent list in this API.
      tags: [repos]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The organization's challenges, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/challenges/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: revokeChallenge
      summary: Revoke an outstanding challenge before it's redeemed
      description: |
        A challenge pasted into a workflow and then thought better of needs a
        kill switch that doesn't require waiting out the TTL. Admin+, same
        bar as issuing one. An already-expired-but-unredeemed challenge can
        still be revoked (harmless — it's already unusable). An
        already-redeemed or already-revoked challenge cannot: there is
        nothing left to change, and this reports the same `404` a
        never-existed or another-org's id gets, so a guessed id can't be
        used to probe which case applies.
      tags: [repos]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/policies:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: listPolicies
      summary: List an organization's live trusted-workload policies
      description: |
        Lifecycle management for policies created by challenge redemption
        (`authorizeRepository`) — DRFT-63. A revoked policy drops off this
        list; build history remains available via `listBuilds` regardless
        (`builds.org_id` is never rewritten by revocation).
      tags: [repos]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The organization's live policies, newest binding first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/policies/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updatePolicy
      summary: Narrow or widen a live policy's constraints
      description: |
        Full-replace on `workflow`/`ref`/`environment` — the only fields
        ever mutable after binding. `repository_id`, `issuer`, and `org_id`
        are absent from the request schema by construction: re-pointing a
        policy at a different repository or org is a new challenge, never
        an edit (spec §4.5).
      tags: [repos]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePolicyRequest' }
      responses:
        '204':
          description: Policy updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: revokePolicy
      summary: Revoke a live policy
      description: |
        Quiet and consequential (spec §4.5, DRFT-63): stops future build
        registration under this org, frees the repository to be re-bound by
        any org via a fresh challenge, and does not touch historical
        attribution — `builds.org_id` is never retroactively rewritten.
      tags: [repos]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Policy revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/members:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: listOrgMembers
      summary: List organization members and pending invites
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Members and pending invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMembersResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/invites:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      operationId: inviteMember
      summary: Invite a member to an organization
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { type: string, enum: [admin, member] }
      responses:
        '201':
          description: Invitation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The address is already a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/orgs/{slug}/invites/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: id
        in: path
        required: true
        description: Opaque WorkOS invitation id, not a local numeric id.
        schema: { type: string }
    delete:
      operationId: revokeInvite
      summary: Revoke a pending organization invitation
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Invitation revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: userID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: changeMemberRole
      summary: Change an organization member's role
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member] }
      responses:
        '204':
          description: Member role changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The change would leave the organization without an owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: removeMember
      summary: Remove a member from an organization
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The removal would leave the organization without an owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/orgs/{slug}/organization:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: getOrganization
      summary: One organization's plan
      tags: [billing]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Organization detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/billing/checkout-session:
    post:
      operationId: createCheckoutSession
      summary: Create a Stripe Checkout session
      description: |
        Returns a URL to redirect the browser to. Checkout itself is browser-native
        and is not reachable from the CLI (spec §5.2a).
      tags: [billing]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, return_url]
              properties:
                plan:
                  $ref: '#/components/schemas/Plan'
                return_url:
                  type: string
                  format: uri
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [checkout_url]
                    properties:
                      checkout_url: { type: string, format: uri }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/billing/portal-session:
    post:
      operationId: createPortalSession
      summary: Create a Stripe billing-portal session
      tags: [billing]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_url]
              properties:
                return_url: { type: string, format: uri }
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [portal_url]
                    properties:
                      portal_url: { type: string, format: uri }
        '401':
          $ref: '#/components/responses/Unauthorized'

components:

  securitySchemes:
    workloadOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The raw OIDC ID token minted by the CI provider, presented directly. The
        server verifies the signature against the issuer's JWKS and maps claims via
        the issuer registry (spec §4.3). Tokens are short-lived and provider-issued;
        Driftmapper never issues, stores, or accepts a static token.
    userSession:
      type: apiKey
      in: cookie
      name: wos-session
      description: WorkOS AuthKit session cookie (spec §4A).

  parameters:
    BuildInstanceId:
      name: buildInstanceId
      in: path
      required: true
      schema: { type: string }
      description: Opaque, server-issued build-instance ID.
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
      description: Assertion-ledger row ID (`Deployment.id`) — a specific historical claim, addressable directly via `getDeployment`.
    Environment:
      name: env
      in: query
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
      description: |
        The deploy-target environment whose current deployment to read — the
        same free-text, repository-scoped name `recordDeployment` accepted,
        spelled identically. No pre-registration step exists, so an unknown
        name is indistinguishable from an empty one (existence hiding).
    TargetRepository:
      name: repo
      in: query
      schema: { type: string }
      description: |
        Optional `owner/name` of another repository whose environment to
        read — for independent verification by a separate repository (an
        e2e suite verifying the deployer's environment). Requires an active
        `kind='verify'` binding; without one, indistinguishable from any
        other 404. Omit to read the token's own repository.
    OrgSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: The organization's URL slug.
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from a previous page's `next_cursor`.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, expired, or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: |
        Authenticated, but not permitted to perform this action — e.g. a member
        role attempting an admin+-only mutation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: |
        No such resource, or the caller is not entitled to know it exists. These are
        deliberately indistinguishable — a distinguishable 403 would let an
        unauthorized caller enumerate valid build-instance IDs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Well-formed request that violates a documented constraint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: |
        A dependency this operation requires is not configured in this
        environment (`error.code: workos_disabled` today; the shape is generic
        so a future unrelated dependency can reuse it without a new response).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    ExchangeTokenRequest:
      type: object
      required: [code, code_verifier]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Authorization code the SPA's `/callback` route received from WorkOS.
        code_verifier:
          type: string
          description: PKCE verifier matching the challenge sent to WorkOS's `/authorize`.

    WorkosUser:
      type: object
      description: |
        The subset of WorkOS's own user object the dashboard SPA needs, returned
        straight from token exchange — WorkOS's string user id, not this API's
        local numeric one (see `User` below). Deliberately not the same shape as
        `User`: this one is who WorkOS says signed in; `User` is this system's own
        record, fetched separately at `GET /v1/me` once a session exists.
      required: [id, email, email_verified]
      properties:
        id: { type: string }
        email: { type: string }
        email_verified: { type: boolean }

    ExchangeTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [access_token, refresh_token, user]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            user: { $ref: '#/components/schemas/WorkosUser' }

    User:
      type: object
      description: This system's own local mirror of the signed-in WorkOS user.
      required: [id, email, email_verified, email_notifications, created_at]
      properties:
        id:
          type: integer
          format: int64
        email: { type: string }
        email_verified: { type: boolean }
        email_notifications: { type: boolean }
        created_at: { type: string, format: date-time }

    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    Provider:
      type: string
      description: |
        CI provider identity. v1 supports GitHub Actions only; further providers are
        additive registry entries and appear here as new enum members (spec §4.4).
        Clients MUST tolerate unknown values in responses.

        `github` is the issuer registry entry name (`internal/oidc.GitHubActionsProviderName`
        server-side), not a literal "GitHub Actions" spelling — matches what every
        `provider`/`claims.Issuer` value on the wire actually contains.
      enum: [github]

    Plan:
      type: string
      enum: [free, paid, enterprise]

    Visibility:
      type: string
      description: |
        Derived from the `repository_visibility` OIDC claim, never client-supplied.
        This is what gates the Free tier's public-repo allowance (spec §6A), so it is
        enforced from the signed token with no VCS API call.
      enum: [public, private, internal]

    BuildMetadata:
      type: object
      description: |
        Free-form organization-defined fields (owning team, ticket reference,
        environment label). Flat string-to-string by design (spec §2.2a): nesting
        would destabilize the wire type under the compatibility window, hurt
        queryability, and invite this field to become a blob store.

        **Always authenticated-tier only.** Customers place arbitrary content here,
        and the two-tier disclosure model depends on knowing exactly what is public,
        so these values never appear in the unauthenticated resolution page or its OG
        tags. There is no per-key public opt-in in v1.

        Keys beginning `driftmapper.` are reserved and rejected, leaving room to
        promote custom fields to first-class ones later without collision. The
        reserved-prefix rule is enforced in server code rather than expressed in the
        `pattern` below: the natural expression is a negative lookahead, which Go's
        RE2 engine cannot compile, so encoding it here would produce a schema the
        server cannot mechanically enforce.
      maxProperties: 50
      propertyNames:
        maxLength: 64
        pattern: '^[A-Za-z0-9_.-]+$'
      additionalProperties:
        type: string
        maxLength: 1024

    BuildRegistration:
      type: object
      description: |
        Only fields the OIDC token cannot attest to. Everything derivable from
        verified claims is server-derived and rejected here (spec §2.2a).
      required: [commit_sha, built_at]
      additionalProperties: false
      properties:
        commit_sha:
          type: string
          minLength: 7
          maxLength: 64
        commit_author:
          type: string
          maxLength: 256
          description: Normalized by the CLI from provider-specific build context.
        commit_committer:
          type: string
          maxLength: 256
        built_at:
          type: string
          format: date-time
        trigger_event:
          type: string
          maxLength: 64
          description: Normalized trigger, e.g. `push`, `pull_request`, `manual`.
        metadata:
          $ref: '#/components/schemas/BuildMetadata'

    BuildPublic:
      type: object
      description: |
        The unauthenticated disclosure tier (spec §2.7). This is exactly what link
        unfurlers and logged-out visitors see on the resolution page: enough to make
        a preview useful and confirm the link is a real Driftmapper build link,
        and nothing more.

        Deliberately excludes committer, author, internal repository path, and all
        custom metadata. This tier matches the disclosure boundary teams already have
        with a plain public build-info file, so nothing that is public today becomes
        private and nothing private today becomes public.
      required: [build_instance_id, repository_name, built_at]
      properties:
        build_instance_id: { type: string }
        repository_name:
          type: string
          description: Short repository name only — never the full internal path.
        built_at: { type: string, format: date-time }

    Build:
      type: object
      description: The authenticated disclosure tier — full metadata (spec §2.7).
      required:
        - build_instance_id
        - repository_id
        - repository_name
        - visibility
        - commit_sha
        - ref
        - workflow
        - built_at
        - registered_at
        - bound
      properties:
        build_instance_id:
          type: string
          description: |
            Opaque and server-issued. Content-addressed over the tuple documented on
            `registerBuild`. Clients MUST treat this as opaque and MUST NOT parse it —
            the derivation is an implementation detail that may change.
        repository_id:
          type: string
          description: |
            Provider's stable repository identifier. Internal identity is keyed on
            this rather than `owner/name`, which changes on rename.
        repository_name: { type: string }
        repository_path:
          type: string
          description: Full `owner/name` path. Authenticated tier only.
        visibility: { $ref: '#/components/schemas/Visibility' }
        provider: { $ref: '#/components/schemas/Provider' }
        commit_sha: { type: string }
        commit_author: { type: string }
        commit_committer: { type: string }
        ref: { type: string }
        workflow: { type: string }
        run_id: { type: string }
        run_attempt:
          type: string
          description: |
            A passthrough OIDC claim value (GitHub's `run_attempt` claim is itself a
            string), never parsed or compared numerically server-side — only used as
            one input to the content-address tuple (spec §2.5a). Typed as a string
            rather than `integer` for that reason.
        trigger_event: { type: string }
        built_at: { type: string, format: date-time }
        registered_at: { type: string, format: date-time }
        resolution_url:
          type: string
          format: uri
          description: |
            Canonical resolution page for this build — the URL written into
            `build-info.html`. Server-provided so the CLI never constructs it and
            cannot drift from server routing.
        bound:
          type: boolean
          deprecated: true
          description: |
            Deprecated (DRFT-84): always `true` as of the release registration started
            requiring a live trusted-workload policy (DRFT-80) — there is no more unbound
            state for this field to report. Scheduled for removal after the N-2
            compatibility window closes (DRFT-85).
        claim_url:
          type: string
          format: uri
          deprecated: true
          description: |
            Deprecated (DRFT-84): always absent as of the same release — `bound` is never
            `false` anymore, so there is nothing left for this field to point at. Scheduled
            for removal after the N-2 compatibility window closes (DRFT-85).
        metadata: { $ref: '#/components/schemas/BuildMetadata' }

    BuildResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Build' }

    BuildListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, page]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Build' }
            page: { $ref: '#/components/schemas/PageInfo' }

    # --- Deployments (deploy-marking, spec's Slice 7) -----------------------
    #
    # One immutable ledger row per deploy-mark call. No update/delete
    # operation exists on this resource anywhere in this API — a
    # correction is always a new row, never an edit.
    Deployment:
      type: object
      description: |
        One immutable ledger row: this build was recorded as deployed to
        this environment. Rows always arrive in order — the server stamps
        `created_at` at request time, so "currently deployed" for an
        environment is always the newest row by `created_at`, never a
        mutated pointer. A correction is a new row, never an edit.

        Same ledger as `Verification`, discriminated only by `kind`
        (`deploy` here, `verify` there) — one assertion coordinate space
        (build, environment, time), two claim types.
      required: [id, kind, repository_id, environment, build_instance_id, deployed_by, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [deploy]
          description: Always `deploy` on this resource.
        repository_id:
          type: string
          description: Provider's stable repository identifier, same identity space as `Build.repository_id`.
        environment:
          type: string
          description: |
            Free-text, scoped to this repository (not the organization).
            Must match `^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$` — lowercase
            alphanumeric and hyphens, 1-63 characters, starting and ending
            with an alphanumeric character (the same shape as a Kubernetes
            namespace name). Rejected outright on submission if it doesn't
            match this pattern; there is no pre-registration step.
        build_instance_id:
          type: string
          description: |
            The build recorded as deployed. On the CI path this is what
            `commit_sha` resolved to — returned so the caller can see
            which build its commit resolved to (multiple builds can share
            a commit; newest wins). Must already be a registered build
            (`registerBuild`). This is the expectation a keyed verification
            compares its observation against.
        url:
          type: string
          format: uri
          nullable: true
          description: |
            Where this deployment lives — the absolute URL of the deployed
            `build-info.html`, recorded by `recordDeployment`'s optional
            `url` field. Null on rows that predate the field or omitted it;
            deployment-keyed verification (`getCurrentDeployment` → fetch →
            compare) is only possible for rows that carry one. HTTPS.
        run_id:
          type: string
          nullable: true
          description: |
            The deploy-triggering CI run's `run_id` OIDC claim. Distinct
            from `Build.run_id`, which describes the run that produced the
            build, not the run that deployed it. Absent (`null`) on
            dashboard-tagged rows, which have no run identity.
        run_attempt:
          type: string
          nullable: true
          description: |
            The deploy-triggering CI run's `run_attempt` claim — a manual
            re-run of the same deploy bumps only this. Distinct from
            `Build.run_attempt` for the same reason as `run_id`. Absent
            (`null`) on dashboard-tagged rows.
        deployed_by:
          type: string
          description: |
            Who recorded this row, discriminated by prefix: `user:<id>`
            for a deployment tagged from the dashboard, or an issuer-scoped
            workload identity (`ci:<issuer>:<repository_id>`, e.g.
            `ci:github:123456`) for one recorded by `recordDeployment`.
            Exactly one cause per row — never both, never neither —
            distinguishing a human action from a CI one in the audit trail.

            Rows recorded before this prefix was normalized may carry the
            bare issuer form (`github:123456`); readers MUST treat both
            forms as the same workload identity shape.
        created_at:
          type: string
          format: date-time
          description: |
            Server-stamped at request time — the sole ordering key for
            "currently deployed." Never client-supplied: an out-of-range
            client timestamp here would have been a permanent,
            uncorrectable corruption of that answer on an insert-only
            ledger, so the server stamps it instead of trusting the caller.

    DeploymentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Deployment' }

    DeploymentRequest:
      type: object
      description: |
        `repository_id` has no field here, mirroring `BuildRegistration`'s
        token-derived/submitted split — the repository is resolved from
        the verified workload OIDC token via the same trusted-workload-
        policy check build registration uses, never from the request.

        Carries `commit_sha`, not `build_instance_id` — a deploy step
        generally cannot know the opaque, server-derived build-instance ID
        (it may live only inside a Docker image layer the deploy job never
        unpacks, or in a separate CI run's stdout). Every deploy topology,
        by contrast, knows the commit it is shipping.
      required: [commit_sha, environment]
      additionalProperties: false
      properties:
        commit_sha:
          type: string
          description: |
            The commit being deployed. The server resolves the newest
            registered build for this commit, scoped to the token's
            repository — an unknown commit, or one belonging to a
            different repository, is a `404` (existence hiding, same
            convention as an unknown build-instance ID). A commit with
            more than one registered build (a manual re-run bumping
            `run_attempt`, or multiple workflows registering the same
            commit) resolves to the newest by `registered_at`.
        environment:
          type: string
          description: See `Deployment.environment` for the validation rule.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Optional. Absolute HTTPS URL of the deployed `build-info.html`
            for this deployment — the target a keyed verification will
            fetch (`driftmapper verify <environment>`). Omitted rows are
            verifiable only by callers that supply their own URL; recording
            it is strongly recommended so the environment name alone
            suffices later.

    DeployBuildRequest:
      type: object
      description: |
        `build_instance_id` comes from the URL (`{buildInstanceId}`), not
        repeated here — the caller is already on that build's resolution
        page.
      required: [environment]
      additionalProperties: false
      properties:
        environment:
          type: string
          description: See `Deployment.environment` for the validation rule.

    Verification:
      type: object
      description: |
        One immutable ledger row: an identity asserted this build was
        observed live in this environment. Same shape as `Deployment` but a
        distinct assertion `kind` (`verify`, not `deploy`) — one claim type
        in the same coordinate space (build, environment, time), never a
        confirmation of one particular deployment record. Rows are
        insert-only; "verified" is a read-time comparison of the latest
        `deploy` vs. latest `verify` claim, and a disagreement is the drift
        signal, not an error state.

        Since deployment-keyed verification (DRFT-98/DRFT-101) the row also
        records *how the check went* via `outcome`: what the caller observed
        at the deployment's URL, including failures to reach or parse it.
        Rows without those fields predate the fields or come from callers
        that only attest; treat them as `outcome: verified`.
      required: [id, kind, repository_id, environment, build_instance_id, asserted_by, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [verify]
          description: Always `verify` on this resource.
        repository_id:
          type: string
          description: |
            The build's **owning** repository's stable provider id — same
            identity space as `Build.repository_id`. Always the build's
            owner, never the caller's token claim.
        environment:
          type: string
          description: |
            Free-text, scoped to this repository. Must match
            `^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$` — same DNS-label rule as
            `Deployment.environment`.
        build_instance_id:
          type: string
          description: |
            The build asserted as observed live. For keyed verification
            this is the checked deployment's expected build; for a bare
            attestation, whatever the caller asserts. Must already be a
            registered build (`registerBuild`).
        deployment_id:
          type: integer
          format: int64
          nullable: true
          description: |
            The deployment row this check ran against — provenance, not
            gating: citing it never blocks or mutates the cited row. Null
            on attestations not keyed to a deployment.
        source_url:
          type: string
          format: uri
          nullable: true
          description: |
            The URL the caller fetched when checking — normally the
            deployment's own `url`. Null when nothing was fetched.
        observed_build_instance_id:
          type: string
          nullable: true
          description: |
            What `driftmapper:build-id` actually said in the deployed file's
            meta tags. Null unless `outcome` is `verified` or `mismatch`.
        outcome:
          type: string
          enum: [verified, mismatch, fetch_failed, parse_failed]
          description: |
            How the check went. `verified` — observed build matches the
            expectation. `mismatch` — it differs (the drift signal,
            recorded as data). `fetch_failed` — the URL could not be
            fetched (unreachable, non-200, TLS/timeout). `parse_failed` —
            something was served but carried no usable driftmapper meta
            tags (wrong page, unsupported schema version). Absent on legacy
            rows: treat as `verified`.
        run_id:
          type: string
          nullable: true
          description: |
            The verifying CI run's `run_id` OIDC claim. Absent (`null`) on
            rows with no run identity.
        run_attempt:
          type: string
          nullable: true
          description: The verifying CI run's `run_attempt` claim.
        asserted_by:
          type: string
          description: |
            The identity that made this claim, discriminated by prefix:
            `ci:<issuer>:<repository_id>` (e.g. `ci:github:123456`) for a
            workload, or `user:<id>` for a human.
        created_at:
          type: string
          format: date-time
          description: |
            Server-stamped at request time — the sole ordering key. Never
            client-supplied, same reasoning as `Deployment.created_at`.

    VerificationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Verification' }

    VerificationRequest:
      type: object
      description: |
        `repository_id` has no field here, mirroring `DeploymentRequest`'s
        token-derived/submitted split — the repository is resolved from the
        verified workload OIDC token, never from the request.

        The required pair (`build_instance_id`, `environment`) keeps the
        row in the assertion coordinate space; the optional outcome fields
        carry what an opinionated caller (`driftmapper verify`) observed.
        All optional fields are additive — bare attesters that send only
        the required pair remain fully valid, and servers treat their rows
        as `outcome: verified`.
      required: [build_instance_id, environment]
      additionalProperties: false
      properties:
        build_instance_id:
          type: string
          description: |
            For keyed verification, the checked deployment's expected build;
            for a bare attestation, the build asserted as observed live.
            Must be an already-registered build (`registerBuild`); an
            unknown ID is a `404` (existence hiding).
        environment:
          type: string
          description: See `Verification.environment` for the validation rule.
        deployment_id:
          type: integer
          format: int64
          description: |
            Optional. The deployment row this check ran against (resolved
            via `getCurrentDeployment`). Provenance only — never a gate or
            reference the server acts on beyond attribution.
        source_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Optional. The URL the caller fetched when checking — normally
            the deployment's recorded `url`.
        observed_build_instance_id:
          type: string
          nullable: true
          description: |
            Optional, null unless a build-id was actually parsed out of the
            served file. Required to be non-null when `outcome` is
            `verified` or `mismatch`, and null otherwise (server-enforced
            once the outcome fields are implemented).
        outcome:
          type: string
          enum: [verified, mismatch, fetch_failed, parse_failed]
          description: |
            Optional; defaults to `verified` when omitted (bare attestation).
            See `Verification.outcome` for the semantics of each value.

    RepositoryAuthorizeRequest:
      type: object
      description: |
        Repository identity is never accepted here — it comes only from the
        verified workload OIDC token (spec §4.5), same rule as
        `BuildRegistration`'s token-derived fields.
      required: [challenge]
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: |
            The single-use value issued by `POST /v1/orgs/{slug}/challenges`.
            Bearer secret — never logged, never written to disk by a
            conforming client.

    RepositoryAuthorization:
      type: object
      description: |
        Confirmation that a challenge was redeemed and the repository is now
        bound — not a full policy record (constraints, timestamps; see
        `Policy`/`listPolicies`, the dashboard-tier policy-management
        operations, DRFT-63).
      required: [repository_id, organization_id]
      properties:
        repository_id:
          type: string
          description: Provider's stable repository identifier, same identity space as `Build.repository_id`.
        organization_id: { type: string }

    RepositoryAuthorizationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RepositoryAuthorization' }

    # --- Challenges (DRFT-61) ----------------------------------------------
    #
    # Never carries the raw secret value except on ChallengeIssued, and only
    # there — createChallenge's response, once, per spec §4.5.
    Challenge:
      type: object
      required: [id, status, attempts, max_attempts, expires_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [live, redeemed, revoked, expired]
          description: |
            Derived, not stored — see `model.Challenge.State()`. Does not
            reflect the attempt cap: a challenge that has hit `max_attempts`
            still reports `live` here until it also expires or is revoked
            (redemption itself is what enforces the cap; this field alone
            isn't sufficient to know whether a further redemption attempt
            would succeed).
        attempts:
          type: integer
          description: Failed redemption attempts against this challenge so far.
        max_attempts:
          type: integer
          description: |
            The cap `attempts` is counted against — past this, redemption
            rejects the challenge outright regardless of `status`/`expires_at`.
        redeemed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    ChallengeIssued:
      allOf:
        - $ref: '#/components/schemas/Challenge'
        - type: object
          required: [value]
          properties:
            value:
              type: string
              description: |
                The raw, single-use challenge secret. Returned **only** by
                `createChallenge`, and only on that one response — never
                recoverable afterward, never present on `listChallenges`
                rows. Paste it into CI as `DRIFTMAPPER_CHALLENGE` before
                navigating away.

    ChallengeIssuedResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ChallengeIssued' }

    ChallengeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Challenge' }

    # --- Policy lifecycle (DRFT-63) ---------------------------------------
    #
    # A policy's own fields carry no repository/org identity: those are
    # immutable by construction (see UpdatePolicyRequest) and already known
    # to a caller acting on one row from PolicyListResponse.
    Policy:
      type: object
      required: [id, state, bound_at]
      properties:
        id:
          type: integer
          format: int64
        workflow:
          type: string
          description: |
            Bare workflow-filename constraint (e.g. `ci.yml`). Null means
            unconstrained — redemption's default policy leaves it unset.
        ref:
          type: string
          description: Git ref constraint (e.g. `refs/heads/main`). Null means unconstrained.
        environment:
          type: string
          description: |
            Deployment-environment constraint. Null means unconstrained; an
            empty string is a real constraint meaning "must target no
            environment" (spec §4.5).
        state:
          type: string
          enum: [live, revoked]
        bound_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    PolicyWithRepository:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          required: [repository_id, repository_path, provider]
          properties:
            repository_id: { type: string }
            repository_path: { type: string, description: '`owner/name` at time of binding.' }
            provider: { $ref: '#/components/schemas/Provider' }

    PolicyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PolicyWithRepository' }

    UpdatePolicyRequest:
      type: object
      description: |
        Full-replace on the three constrainable dimensions: omit a property
        or send it null to leave/set that dimension unconstrained, resubmit
        the current value for anything you're not changing. No
        `repository_id`/`issuer`/`org_id` property exists here — rebinding a
        policy to a different repository or org is a new challenge (DRFT-59/
        62), never an edit.
      additionalProperties: false
      properties:
        workflow: { type: string }
        ref: { type: string }
        environment: { type: string }

    MonitoredUrl:
      type: object
      required: [monitored_url_id, repository_id, url, health, created_at]
      properties:
        monitored_url_id: { type: string }
        repository_id: { type: string }
        url: { type: string, format: uri }
        label: { type: string }
        health: { $ref: '#/components/schemas/IntegrationHealth' }
        last_seen_build_instance_id:
          type: string
          description: |
            Most recent build-instance ID parsed at this URL. Null until the first
            successful poll.
        last_change_observed_at:
          type: string
          format: date-time
          description: |
            When the build ID at this URL last changed — not when it was last
            polled. Poll timestamps are not stored (spec §2.6).
        created_at: { type: string, format: date-time }

    MonitoredUrlResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/MonitoredUrl' }

    MonitoredUrlListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, page]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/MonitoredUrl' }
            page: { $ref: '#/components/schemas/PageInfo' }

    IntegrationHealth:
      type: string
      description: |
        Whether Driftmapper can do its job at this URL — not whether the site is up.

        - `pending` — registered, not yet successfully polled.
        - `ok` — last poll parsed a build ID.
        - `never_succeeded` — has never once succeeded. Surfaced immediately, since
          this almost always means a setup error, not an outage.
        - `failing` — previously succeeded, now failing past the sustained-failure
          threshold.
        - `unsupported_schema` — the file was fetched and parsed, but its
          `driftmapper:schema-version` is one this server does not understand. Held
          distinct from `failing` on purpose: it is neither drift nor a fetch error,
          and the remedy is different (upgrade the server or the CLI, not fix the
          deployment).
      enum: [pending, ok, never_succeeded, failing, unsupported_schema]

    DriftEventType:
      type: string
      enum: [build_id_changed, integration_health_changed]

    DriftEvent:
      type: object
      required: [drift_event_id, type, monitored_url_id, repository_id, observed_at]
      properties:
        drift_event_id: { type: string }
        type: { $ref: '#/components/schemas/DriftEventType' }
        monitored_url_id: { type: string }
        repository_id: { type: string }
        previous_build_instance_id:
          type: string
          description: Null for the first observation at a URL.
        current_build_instance_id: { type: string }
        previous_health: { $ref: '#/components/schemas/IntegrationHealth' }
        current_health: { $ref: '#/components/schemas/IntegrationHealth' }
        observed_at: { type: string, format: date-time }

    DriftEventListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, page]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DriftEvent' }
            page: { $ref: '#/components/schemas/PageInfo' }

    Repository:
      type: object
      required: [repository_id, provider, path, visibility, linked_at]
      properties:
        repository_id: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }
        path: { type: string, description: '`owner/name` at time of last build.' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        latest_build_instance_id: { type: string }
        linked_at: { type: string, format: date-time }

    RepositoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, page]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Repository' }
            page: { $ref: '#/components/schemas/PageInfo' }

    # Org/OrgWithRole (below) are deliberately distinct from Organization
    # (further below): this pair is the bare membership-list shape behind
    # `POST /v1/orgs` and `GET /v1/orgs` (create + switcher), while
    # Organization is `GET /v1/orgs/{slug}/organization`'s billing/plan/
    # slot-usage shape for one already-resolved org. Same underlying table,
    # two different response contracts for two different callers.
    Org:
      type: object
      required: [id, slug, name, personal, created_at]
      properties:
        id:
          type: integer
          format: int64
        slug: { type: string }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's auto-created personal org.
        created_at: { type: string, format: date-time }

    OrgWithRole:
      type: object
      required: [id, slug, name, personal, created_at, role]
      properties:
        id:
          type: integer
          format: int64
        slug: { type: string }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's auto-created personal org.
        created_at: { type: string, format: date-time }
        role:
          type: string
          enum: [owner, admin, member]
          description: The caller's role in this organization.

    OrgResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Org' }

    OrgListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrgWithRole' }

    Membership:
      type: object
      required: [id, org_id, user_id, role, created_at]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        role: { type: string, enum: [owner, admin, member] }
        created_at: { type: string, format: date-time }

    MemberWithUser:
      allOf:
        - $ref: '#/components/schemas/Membership'
        - type: object
          required: [email]
          properties:
            email: { type: string }

    Invite:
      type: object
      required: [id, organization_id, email, state, expires_at]
      properties:
        id: { type: string, description: Opaque WorkOS invitation id. }
        organization_id: { type: string }
        email: { type: string }
        state: { type: string }
        expires_at: { type: string, description: ISO-8601, as reported by WorkOS. }

    OrgMembersResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [members, invites]
          properties:
            members:
              type: array
              items: { $ref: '#/components/schemas/MemberWithUser' }
            invites:
              type: array
              items: { $ref: '#/components/schemas/Invite' }

    InviteResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Invite' }

    Organization:
      type: object
      required: [organization_id, name, plan]
      properties:
        organization_id: { type: string }
        name: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        sso_enforced: { type: boolean }

    OrganizationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Organization' }

    PageInfo:
      type: object
      required: [has_more]
      properties:
        has_more: { type: boolean }
        next_cursor:
          type: string
          description: Present only when `has_more` is true.

    Error:
      type: object
      description: |
        The `error` half of the response envelope (see "Response envelope" above).
        Not RFC 9457 — a from-scratch shape matching what every `cmd/api` route
        actually emits (`internal/api/respond.go`'s `errorBody`).
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable identity of the error. Clients branch on this,
            never on `message`, which may be reworded without a version bump.
            Examples: `validation`, `unauthorized`, `forbidden`, `not_found`,
            `unknown_field`, `claim_mismatch`, `policy_revoked`, `no_live_policy`.
        message:
          type: string
          description: Human-readable, safe to display directly.
        details:
          type: object
          description: |
            Structured, error-specific fields a client can act on programmatically.
            Present only for errors that have them (currently `claim_mismatch` —
            see `ClaimMismatchDetails`); absent otherwise.
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    ClaimMismatchDetails:
      type: object
      description: |
        `error.details` shape when `error.code` is `claim_mismatch`: a signature-
        valid token whose claims did not satisfy the repository's authorization
        policy.

        The mismatched field is named explicitly rather than returning a generic
        authentication failure. This is the single most likely point of first-run
        abandonment — a case-sensitive workflow filename mismatch is a well-
        documented source of setup friction in comparable systems (spec §4.5) —
        and a specific error is cheap to produce and turns a dead end into a
        one-line fix.
      required: [mismatched_claim, expected, actual]
      properties:
        mismatched_claim:
          type: string
          description: e.g. `workflow`, `ref`, `environment`.
        expected:
          type: string
          description: Value the policy requires.
        actual:
          type: string
          description: |
            Value from the verified token. Safe to echo: the caller demonstrably
            already holds this token.
