    get:
      operationId: listAppBaselines
      summary: The baselines of one app, newest first
      description: |
        A baseline is a snapshot of an app: each module at a specific build (DRFT-191).
        Newest first; the newest has `latest: true`. The same caller rule as
        `listAppBuilds`: an admin or owner, or a member in a group the app is granted to.
        Any other caller gets 404, the same as an app that does not exist.
      tags: [deployments]
      x-stability: dashboard
