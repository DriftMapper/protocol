    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: listPolicies
      summary: List an organization's live trusted-workload policies
      description: |
        Admin or owner only (DRFT-176): repository and CI onboarding is
        administration, and a repository's name often gives away an app's.

        Lifecycle management for policies created by challenge redemption
