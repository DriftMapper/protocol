        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      operationId: updatePolicy
      summary: Narrow or widen a live policy's constraints
      description: |
        Full-replace on `workflow`/`ref`/`environment` — the only fields
        ever mutable after binding. `repository_id`, `issuer`, and `org_id`
        are absent from the request schema by construction: re-pointing a
        policy at a different repository or org is a new challenge, never
