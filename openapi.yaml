openapi: 3.1.0

info:
  title: Driftmapper API
  version: 1.0.0
  summary: Build-info registration, resolution, and drift detection.
  description: |
    Source of truth for the Driftmapper wire contract. Go types (`oapi-codegen`,
    types-only) and TypeScript types (`openapi-typescript`) are generated from this
    file; neither is hand-maintained. See spec §5.1b.

    ## Stability tiers

    This document describes one API with two stability tiers. The tier is declared
    per-operation via `x-stability`.

    - `x-stability: public` — the CLI-facing contract. Published in the
      `driftmapper-protocol` Go module, semver'd on this document's version, and
      covered by the compatibility window below. CI pipelines pin CLI versions and
      are never force-upgraded, so these operations must remain backward compatible
      for years.
    - `x-stability: dashboard` — consumed only by the first-party dashboard SPA,
      which deploys in lockstep with the server. Types are generated into the SPA but
      NOT published in the public Go module. Free to change without a major version.

    **The public tier is six operations: `registerBuild`,
    `authorizeRepository`, `recordDeployment`, `getCurrentDeployment`,
    `getDeployment`, and `recordVerification`.**
    The CLI is a CI-pipeline tool first — it writes a build and generates an
    HTML file from the response. `authorizeRepository`
    is a deliberate exception (spec §4.5): redeeming a challenge to bind a
    repository is itself a write (a policy is created), called from the same
    customer CI the CLI already runs in, with the same permanent version-skew
    exposure as build registration. `recordDeployment` joins the public tier
    at inception rather than being promoted later, unlike
    `authorizeRepository` — it is CI-facing by construction
    (`driftmapper deploy` runs in the same CD pipeline the CLI already writes
    builds from), so there was never a dashboard-only period for it to start
    in. `getCurrentDeployment` and `recordVerification` complete the pair
    (DRFT-98/DRFT-101's opinionated verify): verification keys on an
    environment — you build an artifact, deploy an artifact, verify what's
    *currently* deployed — so `driftmapper verify <environment>` first reads
    the current deployment row (its expected build and recorded URL) via
    `getCurrentDeployment`, fetches that URL itself, parses the deployed
    `build-info.html` meta tags, compares what it found against that row,
    and records the outcome via `recordVerification`. The read is keyed by a
    name the caller already owns — the environment its own deploy step
    named — which is what keeps it public-tier-shaped; existence-hiding
    rules are identical to every other operation here. `getDeployment`
    remains alongside as the pinned-row read for callers addressing one
    specific historical claim rather than whatever is currently deployed.
    Every operation besides these six is `dashboard`.

    This is deliberately conservative rather than a judgement that these operations
    will never be CLI-facing; a fully featured CLI is an intended later iteration.
    Promoting an operation from `dashboard` to `public` later is additive and safe.
    Demoting one is a breaking change to a contract already pinned in customer CI,
    which is not. When in doubt, an operation starts `dashboard`.

    ## Compatibility policy

    The server supports the current major version and the two preceding majors (N-2)
    for `public` operations. Within a major version, only additive changes are
    permitted: new optional request fields, new response fields, new enum members in
    response-only positions. CI gates on `oasdiff` breaking-change detection against
    the previous tag, scoped to `public`-tier operations only — `dashboard`-tier
    paths are stripped from both sides of the diff before `oasdiff` runs (see
    `.github/workflows/oasdiff.yml` and `scripts/strip_dashboard_tier.py`), since
    that tier is explicitly exempt from this compatibility window.

    Clients MUST ignore unknown response fields. Servers MUST reject unknown request
    body fields (see the `unknown_field` error code below) rather than silently
    dropping them — silent drops turn a client bug into missing data discovered
    months later.

    ## Response envelope

    Every response is one JSON object with exactly one of `data`/`error` set —
    never both, never neither:

    - **Success**: `{"data": <schema>}`. `data` is the operation's documented
      response schema (a resource, or `{"data": [...], "page": {...}}` for a
      paginated list, itself nested inside the outer `data`).
    - **Failure**: `{"error": {"code", "message", "details"}}`, always
      `Content-Type: application/json` (never `application/problem+json` — this
      is a from-scratch envelope, not RFC 9457). `code` is the stable,
      machine-readable identifier clients branch on; `message` is a human-
      readable string that may be reworded without a version bump; `details` is
      present only for errors with structured, error-specific fields a client
      can act on (e.g. `claim_mismatch`'s `mismatched_claim`/`expected`/
      `actual` — spec §4.5) and is absent otherwise. See the `Error` schema.

    ## Authentication

    Two principals, deliberately non-interchangeable (spec §5.2a):

    - `workloadOidc` — a machine principal. The raw OIDC ID token issued by the CI
      provider, presented as a bearer credential. No Driftmapper-issued static token
      exists anywhere in this system (spec §4). This principal reaches exactly the
      public-tier operations: `registerBuild`, `authorizeRepository`,
      `recordDeployment`, `getCurrentDeployment`, `getDeployment`, and
      `recordVerification`.
    - `userSession` — a human principal, via the WorkOS AuthKit session cookie
      (spec §4A).

    A workload principal can never reach billing or membership operations: a
    compromised CI workflow must not be able to cancel a subscription or add an
    org member.

    There is deliberately no third principal *yet*. A human-scoped CLI credential
    (device-code flow or similar) is not needed while the CLI only writes from CI,
    so it is not specified here — a deferral, not a resolution. It becomes necessary
    the moment a CLI read command is intended to run from a developer's machine.
    Note that CLI reads running *in CI* would need no new principal, so if that
    capability is ever split from laptop-side reads, only the latter forces the
    decision. `getCurrentDeployment` is the first such CI-side read: it authenticates
    with the same workload OIDC token as the writes and is reachable only for
    deployments the token's repository (or a bound verifier of it) already owns
    or is authorized to verify.

    ## Not described here

    The `build-info.html` meta-tag format is also a public contract with third-party
    parsers, but it is not API-shaped. It is versioned separately in
    `FORMAT-build-info.md` in this repository (spec §2.3).

    The resolution page (`/r/{buildInstanceId}`) is server-rendered HTML, not a JSON
    endpoint (spec §2.7). Its two disclosure tiers correspond exactly to the
    `BuildPublic` and `Build` schemas below.

servers:
  - url: https://api.driftmapper.io
    description: Production

security:
  - userSession: []

tags:
  - name: auth
    description: |
      Dashboard SPA sign-in and account session management. All `dashboard`-
      tier: the CLI authenticates with `workloadOidc`, never these.
  - name: builds
    description: Build registration and lookup.
  - name: monitored-urls
    description: URLs polled for drift detection (spec §2.6).
  - name: drift-events
    description: Observed build-ID changes at monitored URLs.
  - name: repos
    description: |
      Repository authorization — binding a repository to an org via
      challenge redemption (spec §4.5), and listing already-bound repos.
  - name: deployments
    description: |
      Assertions in the deploy/verify coordinate space (spec's Slice 7): a
      deploy-mark records which build is currently live in a named
      environment; a verification records an identity asserting a build was
      observed live in one. Both land in one immutable ledger discriminated
      only by assertion `kind` — same coordinate space (build, environment,
      time), same shape. Distinct from `builds`, which is
      registration/lookup of the build artifact itself — both always
      reference an already-registered build. Their read-time comparison is
      the drift signal. Verification keys on a deployment row: the deploy
      step optionally records *where* it deployed (`url`), and the verifying
      step fetches that URL and compares what it finds against what the
      deployment claims — you build an artifact, deploy an artifact, verify a
      deployment.
  - name: orgs
    description: |
      Organization membership/switching for the signed-in user — which orgs they
      belong to and at what role. Distinct from `billing`, which covers a single
      already-resolved org's plan.
  - name: billing
    description: Subscription and checkout.

paths:
  /v1/auth/token:
    post:
      operationId: exchangeToken
      summary: Redeem a WorkOS authorization code for tokens
      description: |
        The second half of the dashboard SPA's PKCE sign-in, and the one part of
        that flow the browser cannot do itself: WorkOS's own token endpoint
        (`https://api.workos.com/user_management/authenticate`) sends no CORS
        headers on its response, so a browser can never read the result directly.
        This endpoint performs the exchange server-side with the server's WorkOS
        API key and relays the tokens back.

        Deliberately unauthenticated — it is how a caller becomes authenticated in
        the first place, so no bearer token exists yet. `code_verifier` (the PKCE
        proof that this caller is the one that started the flow) is the only
        credential guarding it, and the authorization code itself is single-use
        and short-lived at WorkOS: a replay is rejected the same as a wrong
        verifier.

        Also resolves the local user mirror (creating it on first sign-in), so it
        exists before the caller's next request rather than racing the first
        `GET /v1/me`.
      tags: [auth]
      x-stability: dashboard
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeTokenRequest' }
      responses:
        '200':
          description: Exchange succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeTokenResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            The code was invalid, expired, already redeemed, or did not match
            `code_verifier` (`error.code: invalid_grant` in every case — WorkOS
            does not distinguish these to the relying party, and neither does
            this endpoint).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current WorkOS session
      description: |
        Revokes the session named by the bearer token's `sid` claim, so it (and
        any refresh token derived from it) stops working immediately rather than
        just expiring naturally.

        Not gated behind authentication in the usual sense: a missing, expired,
        or already-invalid bearer token is not an error here, it is simply
        nothing further to revoke. That keeps the operation idempotent — logging
        out twice, or logging out after the access token has already died, both
        just get a `204`.
      tags: [auth]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Session revoked, or there was none to revoke.

  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Fetch the signed-in user
      tags: [auth]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/account/email-notifications:
    patch:
      operationId: updateEmailNotifications
      summary: Enable or disable account email notifications
      description: |
        The only account field mutable through this API. Email address,
        password, and verification status are WorkOS-owned — managed via
        AuthKit itself, not here.
      tags: [auth]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204':
          description: Updated.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/builds:
    post:
      operationId: registerBuild
      summary: Register a build and receive its build-instance ID
      description: |
        Called by the CLI during CI. Authenticated with a workload OIDC token only —
        a human session cannot register builds, because build provenance derives
        entirely from verified token claims.

        **Token-derived fields are never accepted in the request body.** Repository
        identity, repository ID, ref, repository visibility, workflow, run ID, and
        run attempt are read from verified claims (spec §2.2a). Supplying any of them
        in the body is rejected with `unknown_field` — if the CLI could self-report
        the repository, any valid token holder could register builds attributed to a
        repository they do not control.

        **Idempotency (spec §2.5a).** The build-instance ID is content-addressed over
        the tuple:

            repository_id + commit_sha + ref + workflow + run_id + run_attempt

        A retried step within the same run attempt therefore resolves to the same ID
        and returns `200` — safe to retry on network failure without creating a
        duplicate. A manual re-run increments `run_attempt` and produces a new ID,
        which is correct: it is a genuinely distinct build instance. Note that
        `commit_sha` alone is insufficient, since the same commit legitimately builds
        many times.

        Registration requires the repository to already carry a live trusted-
        workload policy (spec §4.5) — bind the repository first via
        `authorizeRepository`, then register builds. A token for a repository
        with no live policy is rejected with `error.code: no_live_policy`.

        **This response is the CLI's only template input.** `build_instance_id` and
        `resolution_url` are both server-provided, and the CLI constructs no URLs and
        derives no values of its own when writing `build-info.html`. That keeps the
        generation step a pure function of one response — testable against a fixture
        with no server, and incapable of drifting from server routing.
      tags: [builds]
      x-stability: public
      security:
        - workloadOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRegistration'
      responses:
        '201':
          description: Build registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildResponse' }
        '200':
          description: |
            Identical build already registered; existing record returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Token is signature-valid but not authorized to register this build.
            Includes the claim-mismatch case, which names the specific mismatched
            field rather than failing generically (spec §4.5), reported via
            `error.code: claim_mismatch` with the mismatched field under
            `error.details` — see `ClaimMismatchDetails`. A previously bound
            repository whose policy was revoked reports `error.code: policy_revoked`.
            A repository with no live policy at all — never bound, or never
            reached `authorizeRepository` — reports `error.code: no_live_policy`;
            the message points the caller at the challenge/registration flow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/builds/{buildInstanceId}:
    parameters:
      - $ref: '#/components/parameters/BuildInstanceId'
    get:
      operationId: getBuild
      summary: Fetch one build by its build-instance ID
      description: |
        This is the JSON equivalent of the authenticated tier of the resolution page.
        There is no unauthenticated variant of this endpoint: the public tier exists
        only as server-rendered HTML and OG tags (spec §2.7).
      tags: [builds]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Build detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuildResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/repositories/authorize:
    post:
      operationId: authorizeRepository
      summary: Redeem a challenge to bind a repository to an organization
      description: |
        Called by the CLI during CI, immediately before (or as part of)
        `registerBuild` — see `driftmapper/cli`'s `register` command.
        Authenticated with a workload OIDC token only, exactly like
        `registerBuild`: a human session can never bind a repository by
        itself, only a real CI token can (spec §4.5).

        In one atomic transaction: verifies the token, looks up the challenge
        by its presented value, resolves the issuing org, checks that org's
        plan slot, creates a trusted-workload policy from the **token's**
        claims (never the request body), and burns the challenge. All of it
        commits or none does — there is no window in which a challenge is
        consumed without a resulting policy, or vice versa.

        **Repository identity comes only from the verified token.** The
        request carries nothing but the challenge value itself.

        **Error responses never let a caller distinguish "this challenge
        value never existed" from "it existed but is no longer usable"**
        (expired, revoked, already redeemed, or over its attempt cap) — all
        of those collapse to the same `invalid_challenge` `403`. A caller
        that redeems the same already-consumed challenge again — e.g. a
        repo secret left in place after a successful first bind — gets this
        identical response; it cannot be distinguished from a value that was
        never valid. See `driftmapper/cli`'s docs for the operational
        implication (the CLI logs a one-time reminder to remove the secret
        on first successful redemption, rather than relying on repeat calls
        being silently safe).
      tags: [repos]
      x-stability: public
      security:
        - workloadOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryAuthorizeRequest'
      responses:
        '201':
          description: Challenge redeemed; repository now bound to the org.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryAuthorizationResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: |
            The issuing org's plan slot is exhausted. `error.code:
            upgrade_required` — actionable, names the limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: |
            `error.code: invalid_challenge` — the challenge is unusable, for
            any of the reasons described above, deliberately indistinguishable
            from each other.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `error.code: repository_already_bound` — the token's repository
            already has a live policy bound to a different organization.
            Explicit conflict, not a silent no-op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          description: |
            `error.code: rate_limited` — too many redemption attempts.
            Distinct from the per-account challenge-issuance limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/deployments:
    post:
      operationId: recordDeployment
      summary: Record that a build is deployed to an environment
      description: |
        Called by the CLI during CD (`driftmapper deploy`), or any CI/CD
        system able to present the same workload OIDC token used for build
        registration. Authenticated with a workload OIDC token only — a
        human session cannot use this endpoint; see
        `recordDeploymentForBuild` for the dashboard-tagging equivalent
        covering deploys that don't originate from CLI-integrated CI.

        **Repository identity comes only from the verified token**, exactly
        like `registerBuild`: the token's repository must already carry a
        live trusted-workload policy (spec §4.5), checked via the identical
        `ResolveWorkload` logic `registerBuild` uses rather than a separate
        one. A token for a repository with no live policy is rejected with
        `error.code: no_live_policy`, one with a revoked policy with
        `error.code: policy_revoked`, and one whose workflow/ref/environment
        claims don't satisfy the policy's optional constraints with
        `error.code: claim_mismatch` — the same three cases and codes
        `registerBuild` reports for the same underlying check.

        **Naming collision to be aware of:** the claim-mismatch case above
        can name `environment` as the mismatched field, but that refers to
        the *token's* `environment` claim (which GitHub Environment, if any,
        the CI job ran under — an optional policy constraint) — a completely
        different thing from this request's own `environment` field (the
        free-text deploy-target name, e.g. `production`). The two share a
        name but nothing else; a workflow can be constrained to a specific
        CI-side Environment and still record a deployment to any
        deploy-target environment name.

        **`commit_sha` resolves to a build belonging to the token's
        repository.** The server looks up the newest registered build for
        `(repository_id, commit_sha)`, `repository_id` coming only from the
        verified token. An unknown commit, or one belonging to a different
        repository, reports the same `404`, deliberately indistinguishable
        (existence hiding — a distinguishable error would let a valid token
        holder probe which commits belong to which repository). A commit
        with more than one registered build resolves to the newest by
        `registered_at` — a manual re-run bumps only `run_attempt`, and
        multiple workflows can register the same commit.

        **Environment names** are validated server-side against a
        DNS-label-style rule — see `Deployment.environment`'s description
        below. There is no pre-registration step; a name is accepted or
        rejected outright on submission, and the dashboard always shows the
        full distinct-environment list for a repository so a typo'd
        near-duplicate is visible on sight rather than silently split into
        two.

        **`url` (optional) records where this deployment lives** — the
        absolute URL of the deployed `build-info.html`. It is what makes
        deployment-keyed verification possible: `driftmapper verify
        <environment>` fetches this URL and compares the meta tags it
        finds against this row's build (`getCurrentDeployment` +
        `recordVerification`, DRFT-98/DRFT-101). Omitting it keeps the row
        verify-able only by explicit-URL callers; recording it is strongly
        recommended.

        **Timing and ordering.** The server stamps `created_at` at request
        time — the client never sends a timestamp. Rows always arrive in
        order; "currently deployed" for an environment is always the row
        with the maximum `created_at`. A rollback is just another call
        naming an earlier build — there is no update or delete operation on
        this ledger, ever.

        **Idempotency.** Dedupe key is
        `(repository_id, environment, build_instance_id, run_id, run_attempt)`,
        `run_id`/`run_attempt` coming from the verified token's OIDC claims
        (the deploy-triggering run's identity, not the build's). An
        identical retry (e.g. after a network failure) resolves to the same
        row and returns `200`, mirroring `registerBuild`'s own 201/200
        split. A later run for the same build/environment — a genuine
        roll-forward, not a retry — inserts a new row and returns `201`.

        A build deployed to multiple environments concurrently is the
        normal case, not special-cased — call this once per environment.
      tags: [deployments]
      x-stability: public
      security:
        - workloadOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentRequest'
      responses:
        '201':
          description: Deployment recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '200':
          description: |
            Identical deployment already recorded (same dedupe key);
            existing record returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Token is signature-valid but not authorized for this
            deployment. `error.code: claim_mismatch` names the specific
            mismatched field under `error.details` — see
            `ClaimMismatchDetails` — and note the `environment` naming
            collision described above. A previously bound repository whose
            policy was revoked reports `error.code: policy_revoked`. A
            repository with no live policy at all reports
            `error.code: no_live_policy`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: |
            `commit_sha` has no registered build under the token's
            repository, or has one belonging to a different repository —
            deliberately indistinguishable, as described above.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/deployments/{deploymentId}:
    parameters:
      - $ref: '#/components/parameters/DeploymentId'
    get:
      operationId: getDeployment
      summary: Fetch one deployment by its ledger row ID
      description: |
        The pinned-row companion to `getCurrentDeployment`: reads one
        specific ledger row by ID — useful when a caller wants a particular
        historical claim rather than whatever is currently deployed (audit
        tooling, verifying a specific rollout).

        Authenticated with a workload OIDC token, exactly like the writes.
        Authorization mirrors `getCurrentDeployment`'s: same-repository rows
        are readable by the token's own repository; cross-repo readers need
        an active binding of `kind='verify'` for that
        `(acting_repository_id, target_repository_id)` pair — a read
        cannot outrun the write it feeds.

        **404s are deliberately indistinguishable**: unknown ID, a
        deployment belonging to another repository, and a cross-repo row
        with no verify binding all report the same `not_found` (existence
        hiding), the same convention every other operation in this API uses.
      tags: [deployments]
      x-stability: public
      security:
        - workloadOidc: []
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Token is signature-valid but not authorized. `error.code:
            no_live_policy`, `policy_revoked`, or `claim_mismatch` — the
            same three cases every other workload-OIDC operation reports for
            the underlying trusted-workload-policy check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: |
            No such deployment, or the caller is not entitled to know it
            exists — deliberately indistinguishable, as described above.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/deployments/current:
    get:
      operationId: getCurrentDeployment
      summary: Fetch the deployment currently claimed for an environment
      description: |
        The CI-side read half of deployment-keyed verification
        (`driftmapper verify <environment>`, DRFT-98/DRFT-101): the
        verifying step knows a constant — an environment name its own
        deploy step already used — and needs what the *current* deployment
        row carries: the expected `build_instance_id`, and (when recorded)
        the `url` to fetch.

        "Currently deployed" is the newest `kind='deploy'` row for
        `(repository_id, environment)` by `created_at` — never a
        client-supplied notion of currency. Environments need no
        pre-registration: a name comes into existence when the first
        deployment claims it, so an unknown name and a typo'd near-duplicate
        are indistinguishable from each other here (and from the cross-repo
        case below); the dashboard's distinct-environment list is where a
        typo becomes visible on sight.

        Authenticated with a workload OIDC token, exactly like the writes.
        By default the read resolves against the token's own repository.
        Passing `repo` (`owner/name`) targets another repository's
        environment and requires an active binding of `kind='verify'` for
        that `(acting_repository_id, target_repository_id)` pair —
        independent verification by a separate repository (e.g. an e2e
        suite asserting after its own checks) is a first-class use case,
        gated by the same admin-created binding `recordVerification`
        honors. A read cannot outrun the write it feeds.

        **404s are deliberately indistinguishable**: no rows yet for the
        environment, a misspelled environment name, an unknown target
        repository, and a cross-repo request with no verify binding all
        report the same `not_found` (existence hiding), the same convention
        every other operation in this API uses.
      tags: [deployments]
      x-stability: public
      security:
        - workloadOidc: []
      parameters:
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/TargetRepository'
      responses:
        '200':
          description: |
            The deployment currently claimed for that environment. `url` is
            null when the deploy step recorded none — verification then
            needs the caller to supply the fetch target itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Token is signature-valid but not authorized. `error.code:
            no_live_policy`, `policy_revoked`, or `claim_mismatch` — the
            same three cases every other workload-OIDC operation reports for
            the underlying trusted-workload-policy check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: |
            Nothing verifiable under that coordinate — deliberately
            indistinguishable, as described above.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/verifications:
    post:
      operationId: recordVerification
      summary: Record that a build was verified live in an environment
      description: |
        Called by the CLI during CD (`driftmapper verify <environment>`),
        or any CI/CD system able to present the same workload OIDC token used
        for build registration. Authenticated with a workload OIDC token
        only — a human session cannot use this endpoint.

        **The caller checks reality; this endpoint records what was found.**
        Verification keys on an environment's current deployment — you build
        an artifact, deploy an artifact, verify what's currently deployed.
        The verifying step resolves the current deployment via
        `getCurrentDeployment`, fetches its recorded URL
        itself, parses the deployed `build-info.html` meta tags (spec §2.3's
        contract), compares the observed build-instance ID against the
        deployment's expected one, and reports here. DriftMapper-the-service
        still never fetches the environment itself (spec DRFT-27) — the fetch
        lives in the customer's own CI, which is a strictly better trust
        position than server-side polling. The outcome fields below record
        the finding: `outcome: verified` on a match, `mismatch` when the
        observed build differs from the deployment's expectation (the drift
        signal, recorded as data rather than rejected), and `fetch_failed` /
        `parse_failed` when nothing observable could be learned — failed
        observations are assertions too. Rows stay insert-only immutable
        claims in the same coordinate space as deploys (build, environment,
        time); "verified" remains a read-time comparison of the latest
        claims, and a disagreement between them *is* the signal, not an
        error state. Citing a deployment never blocks, retries, or mutates
        it — verification runs on its own schedule, independent of deploy.

        **`build_instance_id` names the checked deployment's expected
        build**; `observed_build_instance_id` carries what the meta tags
        actually said (null when nothing could be parsed). The server
        resolves the build's **owning** repository from the ID, never from
        the token.

        **Repository identity comes only from the verified token**, exactly
        like `recordDeployment`: the token's repository must already carry a
        live trusted-workload policy (spec §4.5), checked via the identical
        `ResolveWorkload` logic — the same `no_live_policy`,
        `policy_revoked`, and `claim_mismatch` error cases apply. When the
        token's repository is not the build's owning repository, an active
        `bindings` row of `kind='verify'` for that
        `(acting_repository_id, target_repository_id)` pair is required; a
        missing one reports the same `404` an unknown build-instance ID gets
        (existence hiding).

        **Environment names** are validated server-side against the same
        DNS-label-style rule as `recordDeployment` — see
        `Verification.environment` below. The server stamps `created_at` at
        request time; the client never sends a timestamp.

        **Idempotency.** Dedupe key is
        `(kind, repository_id, environment, build_instance_id, run_id,
        run_attempt)`, `run_id`/`run_attempt` coming from the verified token's
        OIDC claims (the verifying run's identity). An identical retry
        resolves to the same row and returns `200`, mirroring
        `recordDeployment`'s own 201/200 split.
      tags: [deployments]
      x-stability: public
      security:
        - workloadOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '201':
          description: Verification recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResponse' }
        '200':
          description: |
            Identical verification already recorded (same dedupe key);
            existing record returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Token is signature-valid but not authorized for this
            verification. `error.code: claim_mismatch` names the specific
            mismatched field under `error.details` — see
            `ClaimMismatchDetails`. A previously bound repository whose
            policy was revoked reports `error.code: policy_revoked`. A
            repository with no live policy at all reports
            `error.code: no_live_policy`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: |
            `build_instance_id` has no registered build, or (for a cross-repo
            verifier) belongs to a repository the caller has no `kind='verify'`
            binding to — deliberately indistinguishable, as described above.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/monitored-urls:
    post:
      operationId: createMonitoredUrl
      summary: Register a URL for drift polling
      description: |
        **Precondition (spec §2.6):** the repository must already be authorized to
        an organization and it must have at least one registered build. Polling
        before a build exists can only produce a spurious never-yet-succeeded
        notice, since there is no prior build-instance ID to diff against.
        Violations return `precondition_not_met`.

        The registered URL is fetched by an isolated worker with its own egress
        policy and restricted database role. Registering a URL that resolves to a
        private, link-local, or loopback address is rejected — evaluated after DNS
        resolution, and re-evaluated at every redirect hop.
      tags: [monitored-urls]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository_id, url]
              properties:
                repository_id:
                  type: string
                  description: Must reference a confirmed repository.
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: |
                    Absolute URL of the deployed `build-info.html`. HTTPS only.
                label:
                  type: string
                  maxLength: 128
                  description: Human label, e.g. "production" or "staging".
      responses:
        '201':
          description: URL registered; polling begins on the next scheduled cycle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoredUrlResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: This URL is already registered for this repository.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      operationId: listMonitoredUrls
      summary: List monitored URLs
      tags: [monitored-urls]
      x-stability: dashboard
      security:
        - userSession: []
      parameters:
        - name: repository_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of monitored URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoredUrlListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/monitored-urls/{monitoredUrlId}:
    parameters:
      - name: monitoredUrlId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMonitoredUrl
      summary: Fetch one monitored URL, including its last-seen build
      description: |
        `last_seen_build_instance_id` is the CLI's "what is currently live at this
        URL" answer.
      tags: [monitored-urls]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Monitored URL detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoredUrlResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMonitoredUrl
      summary: Stop polling a URL
      description: |
        Polling stops immediately. Historical drift events are retained — they are
        observations that happened, and deleting them would falsify history.
      tags: [monitored-urls]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/drift-events:
    get:
      operationId: listDriftEvents
      summary: List observed drift events
      description: |
        Only change events and integration-health transitions are stored — never raw
        poll logs (spec §2.6). An empty result means nothing changed, not that
        nothing was checked.

        This is explicitly not an uptime feed. A URL being unreachable surfaces as an
        `integration_health` event meaning "we cannot do our job at this URL", after
        a sustained-failure threshold; it is not an availability signal and must not
        be presented as one.
      tags: [drift-events]
      x-stability: dashboard
      security:
        - userSession: []
      parameters:
        - name: repository_id
          in: query
          schema: { type: string }
        - name: monitored_url_id
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/DriftEventType' }
        - name: observed_after
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of drift events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriftEventListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/orgs:
    post:
      operationId: createOrg
      summary: Create an organization
      description: |
        Creates a new, non-personal organization via the WorkOS API and adds the
        caller as its `owner` — distinct from the personal org every user already
        has, which is provisioned automatically on first sign-in and never created
        through this endpoint.
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listOrgs
      summary: List the signed-in user's organizations
      description: |
        Every organization the caller is a member of, each with the caller's role
        in it. This is what the dashboard SPA's org context/switcher resolves
        against — not paginated (a user's org count is small by construction: one
        personal org plus however many they've created or been invited to).

        Ordered personal org first, then by creation date ascending.
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The caller's organizations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgListResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/orgs/{slug}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: getOrg
      summary: Get one organization
      tags: [orgs]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Organization detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOrg
