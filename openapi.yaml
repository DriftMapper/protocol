        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '200':
          description: Group updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'
    delete:
      operationId: deleteGroup
      summary: Delete a group
      description: The built-in Everyone group cannot be deleted (422).
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Group deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/groups/{groupID}/members:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/GroupID'
    get:
      operationId: listGroupMembers
      summary: List a group's members
      description: |
        For the built-in Everyone group this is every active member of the
        organization.
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Members of the group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMembersResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'
    post:
      operationId: addGroupMember
      summary: Add an organization member to a group
      description: Membership of the built-in Everyone group is implicit (422).
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, format: int64 }
      responses:
        '204':
          description: Member added. Adding an existing member is a no-op.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/groups/{groupID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/GroupID'
      - name: userID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: removeGroupMember
      summary: Remove a member from a group
      description: Membership of the built-in Everyone group is implicit (422).
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/apps:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: listApps
      summary: List the apps the caller can access
      description: |
        Admins and owners get every app in the organization, which is also the
        list they grant groups access to. A member gets only the apps one of
        their groups is granted (DRFT-176); a member in no granting group gets
        an empty list. Apps are created the first time CI registers a module
        of them. If the caller's groups cannot be determined the answer is 503,
        never a guess.
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Apps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppsResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/apps/{appID}:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - name: appID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: deleteApp
      summary: Delete an app and everything recorded under it
      description: |
        Permanently deletes the app with its modules, builds, deployment records,
        environments, baselines and group grants. There is no undo. An admin or owner
        only; a member gets 403 whatever their groups grant. An app that does not exist
        in this organization is a 404.

        An app is created the first time CI registers a module of it, so a pipeline that
        still names the app registers it again, empty, on its next run. Change the
        pipeline's app name first.
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '204':
          description: App deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/groups/{groupID}/apps:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
      - $ref: '#/components/parameters/GroupID'
    get:
      operationId: listGroupApps
      summary: List the apps a group can access
      description: |
        Admin or owner only. Access to an app means all of its fields. An app
        no group is granted is visible to admins and owners only.
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: The apps granted to the group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAppsResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'
    put:
      operationId: setGroupApps
      summary: Replace the apps a group can access
      description: |
        Replaces the whole set in one transaction. Works for the built-in
        Everyone group too, which can be granted apps but not otherwise changed.
        An unknown app id, or one from another organization, is a 422 and
        changes nothing.
      tags: [groups]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupApps' }
      responses:
        '200':
          description: The apps now granted to the group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupAppsResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/GroupsUnavailable'

  /v1/orgs/{slug}/organization:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    get:
      operationId: getOrganization
      summary: One organization's plan
      tags: [billing]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Organization detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/orgs/{slug}/billing/checkout:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      operationId: startOrgCheckout
      summary: Start a Stripe Checkout session to upgrade to Team
      description: |
        Always upgrades to Team — there is no plan parameter here for a
        forged request to target Enterprise (spec: Enterprise is
        operator-provisioned only, never self-serve). Returns a hosted
        Stripe Checkout URL; the caller does a full-page navigation to it,
        never an in-app render. The org's plan does not change on return
        from this URL — only the Stripe webhook (out of band) is
        authoritative, so a client should treat a fresh return as
        "processing" until it observes `is_paid` flip via `getOrganization`.

        DRFT-135 (PR 2): reverses DRFT-117's original decision to keep
        checkout server-rendered-only in `cmd/hub` — see that ticket for the
        reasoning. `cmd/hub`'s equivalent SSR route is gone once this ships.
      tags: [billing]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interval:
                  type: string
                  enum: [monthly, annual]
                  description: Defaults to monthly when omitted.
      responses:
        '200':
          description: Hosted Stripe Checkout session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutSessionResponse' }
        '400':
          description: |
            No such plan/interval is priced (e.g. annual billing isn't
            configured in this environment).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Billing is not configured in this environment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/orgs/{slug}/billing/portal:
    parameters:
      - $ref: '#/components/parameters/OrgSlug'
    post:
      operationId: startOrgPortal
      summary: Start a Stripe Customer Portal session
      description: |
        Opens the hosted Stripe Customer Portal so an owner can manage,
        change, or cancel the org's subscription. Same reversal of DRFT-117
        as `startOrgCheckout` above — see that operation's description.
      tags: [billing]
      x-stability: dashboard
      security:
        - userSession: []
      responses:
        '200':
          description: Hosted Stripe Customer Portal session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSessionResponse' }
        '400':
          description: |
            The org has never checked out — there is no Stripe customer to
            open a portal session for. A client should route to
            `startOrgCheckout` instead; this is not expected to be reachable
            from the dashboard SPA, which only shows "Manage subscription"
            when `is_paid` is already true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Billing is not configured in this environment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /v1/admin/users/reset-plan:
    post:
      operationId: adminPlanUserReset
      summary: Preview tearing a user down across Postgres, WorkOS, and Stripe
      description: |
        Platform-admin only (`users.is_platform_admin`; see the `admin` tag
        description). Always recomputes fresh from live state — never accepts
        a client-supplied plan — so there is no staleness/replay gap between
        an operator's dry-run and a later `adminExecuteUserReset` call.
        Read-only: builds and returns the plan, changes nothing.
      tags: [admin]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200':
          description: The computed reset plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminResetPlanResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/admin/users/reset:
    post:
      operationId: adminExecuteUserReset
      summary: Tear a user down across Postgres, WorkOS, and Stripe
      description: |
        Platform-admin only (`users.is_platform_admin`; see the `admin` tag
        description). `confirm` must equal `email` on every call — there is
        no "is this prod" signal left to conditionally require it on, since a
        deployed `cmd/api` instance simply *is* one environment; the
        equivalent guard is now which URL the operator's shell pointed
        `cmd/admin` at, not a flag.

        Internally re-plans from live state, then executes in one request —
        same staleness-avoidance reason as `adminPlanUserReset`. A plan that
        is blocked (the user is the sole owner of a shared org with other
        members) is refused before any step runs: `422` with
        `error.code: reset_blocked` and `error.details.orgs` naming the
        blocking org(s).

        Returns `200` with the full step-by-step report **even when some
        steps failed** — `data.failed` carries that; the HTTP status answers
        "did the server process this request," not "did every step
        succeed." External systems (Stripe, WorkOS) are always acted on
        before the local database, so a failure at any point leaves the
        local database fully intact and the whole operation safe to retry.
      tags: [admin]
      x-stability: dashboard
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, confirm]
              properties:
                email: { type: string }
                confirm:
                  type: string
                  description: Must equal `email`, required on every call.
      responses:
        '200':
          description: |
            The execution report. Check `data.failed` — a `200` does not by
            itself mean every step succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminResetReportResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Either `confirm` did not equal `email` (`error.code:
            confirm_mismatch`), or the reset is blocked (`error.code:
            reset_blocked`, `error.details.orgs` names the blocking org(s)) —
            in both cases nothing was executed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:

  securitySchemes:
    workloadOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The raw OIDC ID token minted by the CI provider, presented directly. The
        server verifies the signature against the issuer's JWKS and maps claims via
        the issuer registry (spec §4.3). Tokens are short-lived and provider-issued;
        Driftmapper never issues, stores, or accepts a static token.
    userSession:
      type: apiKey
      in: cookie
      name: wos-session
      description: WorkOS AuthKit session cookie (spec §4A).

  parameters:
    BuildInstanceId:
      name: buildInstanceId
      in: path
      required: true
      schema: { type: string }
      description: Opaque, server-issued build-instance ID.
    OrgSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: The organization's URL slug.
    GroupID:
      name: groupID
      in: path
      required: true
      schema: { type: string }
      description: Opaque group id (a WorkOS `group_...` id, or `everyone` for the built-in group).
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from a previous page's `next_cursor`.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, expired, or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: |
        Authenticated, but not permitted to perform this action — e.g. a member
        role attempting an admin+-only mutation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: |
        No such resource, or the caller is not entitled to know it exists. These are
        deliberately indistinguishable — a distinguishable 403 would let an
        unauthorized caller enumerate valid build-instance IDs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Well-formed request that violates a documented constraint.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    GroupsUnavailable:
      description: |
        Groups could not be read or changed: WorkOS failed or groups are not
        configured in this environment (`error.code: groups_unavailable` or
        `workos_disabled`). Retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: |
        A dependency this operation requires is not configured in this
        environment (`error.code: workos_disabled` today; the shape is generic
        so a future unrelated dependency can reuse it without a new response).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:

    User:
      type: object
      description: This system's own local mirror of the signed-in WorkOS user.
      required: [id, email, email_verified, email_notifications, created_at]
      properties:
        id:
          type: integer
          format: int64
        email: { type: string }
        email_verified: { type: boolean }
        email_notifications: { type: boolean }
        created_at: { type: string, format: date-time }

    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    Provider:
      type: string
      description: |
        CI provider identity. v1 supports GitHub Actions only; further providers are
        additive registry entries and appear here as new enum members (spec §4.4).
        Clients MUST tolerate unknown values in responses.

        `github` is the issuer registry entry name (`internal/oidc.GitHubActionsProviderName`
        server-side), not a literal "GitHub Actions" spelling — matches what every
        `provider`/`claims.Issuer` value on the wire actually contains.
      enum: [github]

    Plan:
      type: string
      description: |
        Solo is free and capped at one org member; Team is a flat price with no
        member cap; Enterprise is a fixed higher price with an SSO entitlement
        and no self-serve checkout — provisioned by an operator moving the
        subscription to an Enterprise price in the Stripe dashboard (DRFT-117,
        supersedes the earlier free/paid/enterprise naming and DRFT-72's
        per-seat pricing).
      enum: [solo, team, enterprise]

    Visibility:
      type: string
      description: |
        Derived from the `repository_visibility` OIDC claim, never client-supplied.
        Repository binding is unlimited and unmetered on every plan (DRFT-72/117);
        this claim has no billing role.
      enum: [public, private, internal]

    BuildMetadata:
      type: object
      description: |
        Free-form organization-defined fields (owning team, ticket reference,
        environment label). Flat string-to-string by design (spec §2.2a): nesting
        would destabilize the wire type under the compatibility window, hurt
        queryability, and invite this field to become a blob store.

        **Always authenticated-tier only.** Customers place arbitrary content here,
        and the two-tier disclosure model depends on knowing exactly what is public,
        so these values never appear in the unauthenticated resolution page or its OG
        tags. There is no per-key public opt-in in v1.

        Keys beginning `sys_` (matched case-insensitively) are reserved and
        rejected: the prefix is the namespace for server-stamped keys, so a key
        under it means the server set it, never the customer's pipeline. The name
        is deliberately brand-neutral (DRFT-181). The reserved-prefix rule is
        enforced in server code rather than expressed in the `pattern` below: the
        natural expression is a negative lookahead, which Go's RE2 engine cannot
        compile, so encoding it here would produce a schema the server cannot
        mechanically enforce.
      maxProperties: 200
      propertyNames:
        maxLength: 64
        pattern: '^[A-Za-z0-9_.-]+$'
      additionalProperties:
        type: string
        maxLength: 4096

    BuildRegistration:
      type: object
      description: |
        The `registerBuild` request body. DRFT-129 relaxed spec §2.2a's original
        "token-derived, never from the body" rule so the CLI may submit its own view
        of build identity; DRFT-182 tightens it again for what the token proves:
        `commit_sha` and `trigger_event` come from the verified token when it carries
        them, and a submitted value is only confirmed against it.

        `repository` is optional (omitting it is still valid, for backward
        compatibility with CLI versions predating this field) but when present is
        *confirmed* against the workload OIDC token's verified repository claim and
        rejected with `claim_mismatch` on any difference — it is never trusted from
        the body alone, and the stored build is still attributed to the
        claims-derived repository, not the submitted one. `ref` is informational
        only; the token's own `ref` claim remains authoritative.
      required: [built_at]
      additionalProperties: false
      properties:
        repository:
          type: string
          maxLength: 256
          description: |
            `owner/name`. Confirmed against the token's verified repository
            claim; see this schema's own description.
        app:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The app this build belongs to. Defaults to the repository name. Created
            on first registration.
        module:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The module within the app. Defaults to the app name, so a single-module
            app needs no change. Bound to the repository that first registered it.
        ref:
          type: string
          maxLength: 256
          description: |
            Git ref, e.g. `refs/heads/main`. Read directly from git by the CLI
            (`internal/gitcontext`). Informational; the token's `ref` claim is
            authoritative.
        commit_sha:
          type: string
          minLength: 7
          maxLength: 64
          description: |
            Optional since DRFT-182. When the workload token carries the commit
            (GitHub Actions: `sha`), the token's value is used and a submitted value
            is confirmed against it (`claim_mismatch` on difference). Required only
            for an issuer whose token does not carry it.
        commit_author:
          type: string
          maxLength: 256
          description: Normalized by the CLI from provider-specific build context.
        commit_committer:
          type: string
          maxLength: 256
        built_at:
          type: string
          format: date-time
        trigger_event:
          type: string
          maxLength: 64
          description: |
            Normalized trigger, e.g. `push`, `pull_request`, `manual`. Derived from
            the token when it carries the event (GitHub Actions: `event_name`); a
            submitted value is confirmed against it (DRFT-182).
        metadata:
          $ref: '#/components/schemas/BuildMetadata'

    BuildPublic:
      type: object
      description: |
        The unauthenticated disclosure tier (spec §2.7). This is exactly what link
        unfurlers and logged-out visitors see on the resolution page: enough to make
        a preview useful and confirm the link is a real Driftmapper build link,
        and nothing more.

        Deliberately excludes committer, author, internal repository path, and all
        custom metadata. This tier matches the disclosure boundary teams already have
        with a plain public build-info file, so nothing that is public today becomes
        private and nothing private today becomes public.
      required: [build_instance_id, repository_name, built_at]
      properties:
        build_instance_id: { type: string }
        repository_name:
          type: string
          description: |
            Short repository name only — never the full internal path.
        built_at: { type: string, format: date-time }

    Build:
      type: object
      description: The authenticated disclosure tier — full metadata (spec §2.7).
      required:
        - build_instance_id
        - app
        - module
        - repository_id
        - repository_name
        - visibility
        - commit_sha
        - ref
        - workflow
        - built_at
        - registered_at
      properties:
        build_instance_id:
          type: string
          description: |
            Opaque and server-issued. Content-addressed over the module and commit
            documented on `registerBuild`. Clients MUST treat this as opaque and MUST NOT
            parse it — the derivation is an implementation detail that may change.
        app: { type: string }
        module: { type: string }
        repository_id:
          type: string
          description: |
            Provider's stable repository identifier. Internal identity is keyed on
            this rather than `owner/name`, which changes on rename.
        repository_name: { type: string }
        repository_path:
          type: string
          description: Full `owner/name` path. Authenticated tier only.
        visibility:
          $ref: '#/components/schemas/Visibility'
        provider:
          $ref: '#/components/schemas/Provider'
        commit_sha: { type: string }
        commit_author: { type: string }
        commit_committer: { type: string }
        ref: { type: string }
        workflow: { type: string }
        run_id: { type: string }
        run_attempt:
          type: string
          description: |
            A passthrough OIDC claim value (GitHub's `run_attempt` claim is itself a
            string), never parsed or compared numerically server-side. Typed as a string
            rather than `integer` for that reason. The run, attempt and workflow
            shown are those of the first registration; later ones are history.
        trigger_event: { type: string }
        built_at: { type: string, format: date-time }
        registered_at: { type: string, format: date-time }
        resolution_url:
          type: string
          format: uri
          description: |
            Canonical resolution page for this build — the URL written into
            `build-info.html`. Server-provided so the CLI never constructs it and
            cannot drift from server routing.
        metadata: { $ref: '#/components/schemas/BuildMetadata' }

    BuildResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Build' }

    BuildListPayload:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Build' }
        page: { $ref: '#/components/schemas/PageInfo' }

    BuildListResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/BuildListPayload' }

    DeploymentRequest:
      type: object
      description: |
        The `recordDeployment` request body. There is no field for the time, the
        repository, the workflow or the run: the time is set by the server and the
        rest come from the verified token.
      additionalProperties: false
      properties:
        environment:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          description: |
            Required unless the token carries an environment, in which case that one is
            used and a different value is rejected.
        app:
          type: string
          minLength: 1
          maxLength: 128
          description: The app. Defaults to the repository name, as in `registerBuild`.
        module:
          type: string
          minLength: 1
          maxLength: 128
          description: The module. Defaults to the app name, as in `registerBuild`.
        build_instance_id:
          type: string
          description: |
            The exact build, as written in `build-info.html`. Mutually exclusive with
            `commit_sha`.
        commit_sha:
          type: string
          minLength: 7
          maxLength: 64
          description: |
            The commit of the build being deployed. Defaults to the token's commit.
            Mutually exclusive with `build_instance_id`. Taken as declared, not
            confirmed against the token: the token proves who is recording, not what
            was deployed.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            Where this deployment serves its `build-info` file, an absolute `https` URL.
            Optional. Lets a later check find the running instance without separate
            configuration. Declared by the pipeline.

    Deployment:
      type: object
      description: |
        A CI-reported record that a build is in an environment. A claim by the
        pipeline, not verification of what is running.
      required:
        - app
        - module
        - environment
        - build_instance_id
        - commit_sha
        - deployed_at
      properties:
        app: { type: string }
        module: { type: string }
        environment: { type: string }
        build_instance_id: { type: string }
        commit_sha: { type: string }
        url:
          type: string
          format: uri
        deployed_at:
          type: string
          format: date-time
          description: Set by the server when the record was received.

    DeploymentResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Deployment' }

    EnvironmentState:
      type: object
      description: |
        What one module is running in one environment, as the newest deployment record
        claims. A claim by the deploying pipeline, not a check of what is running.
      required:
        - module
        - environment
        - build_instance_id
        - commit_sha
        - running_since
        - last_recorded_at
      properties:
        module: { type: string }
        environment: { type: string }
        build_instance_id: { type: string }
        commit_sha: { type: string }
        running_since:
          type: string
          format: date-time
          description: |
            When this build last changed: the first record of the unbroken run of
            records that name it. A redeploy of the same build does not move it.
        last_recorded_at:
          type: string
          format: date-time
          description: When the newest record was received, a redeploy included.
        url:
          type: string
          format: uri
          description: Where the newest record says this deployment serves its build-info.
        resolution_url:
          type: string
          format: uri
          description: The build's resolution page.

    EnvironmentStatesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/EnvironmentState' }

    AppMatrix:
      type: object
      description: |
        An app's modules against its environments. Cells are claims by the deploying
        pipeline, not a check of what is running.
      required: [as_of, modules, environments, cells]
      properties:
        as_of:
          type: string
          format: date-time
          description: |
            The server's time when this was read. Every cell reflects the records received
            at or before it, so a copy of the matrix (a screenshot, an export) can be dated
            by the server's clock and not the viewer's.
        modules:
          type: array
          description: Every module of the app, ordered by name.
          items: { type: string }
        environments:
          type: array
          description: Every environment of the app, in the order first recorded.
          items: { type: string }
        cells:
          type: array
          description: |
            One entry per module and environment that has at least one record. A pair with
            no entry has had nothing reported.
          items: { $ref: '#/components/schemas/EnvironmentState' }
        baseline:
          $ref: '#/components/schemas/Baseline'
        drift:
          type: array
          description: |
            One entry for every module and environment, present with `baseline`. See
            `getAppMatrix` for what `match` and `differs` mean.
          items: { $ref: '#/components/schemas/DriftCell' }

    DriftCell:
      type: object
      required: [module, environment, status]
      properties:
        module: { type: string }
        environment: { type: string }
        status: { type: string, enum: [match, differs] }

    BaselineItem:
      type: object
      description: One module at a build, as the baseline recorded it.
      required: [module, build_instance_id, commit_sha]
      properties:
        module: { type: string }
        build_instance_id: { type: string }
        commit_sha: { type: string }
        resolution_url:
          type: string
          format: uri
          description: The build's resolution page.

    Baseline:
      type: object
      description: |
        A snapshot of an app: each module that had a build in `source_environment`, at that
        build. Immutable.
      required: [id, created_at, source_environment, created_by_email, latest, items]
      properties:
        id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        source_environment: { type: string }
        created_by_email:
          type: string
          description: Who took the snapshot, as of then.
        latest:
          type: boolean
          description: True on the app's newest baseline.
        items:
          type: array
          items: { $ref: '#/components/schemas/BaselineItem' }

    BaselineResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Baseline' }

    BaselineListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Baseline' }

    AppMatrixResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AppMatrix' }

    DeploymentRecord:
      type: object
      description: |
        One deployment record in the history of a module in an environment. A claim by
        the deploying pipeline, not a check of what is running. `deployed_at` is when the
        server received it.
      required:
        - build_instance_id
        - commit_sha
        - deployed_at
        - changed
        - running_since
        - recorded_by_issuer
        - recorded_by_subject
      properties:
        build_instance_id: { type: string }
        commit_sha: { type: string }
        deployed_at: { type: string, format: date-time }
        changed:
          type: boolean
          description: |
            The build differs from the previous record in this module and environment.
            True for the first record.
        running_since:
          type: string
          format: date-time
          description: |
            The first record of the unbroken run of records that name this record's build.
        url: { type: string, format: uri }
        resolution_url: { type: string, format: uri }
        recorded_by_issuer:
          type: string
          description: The issuer registry name of the principal that reported it.
        recorded_by_subject:
          type: string
          description: The token subject of the principal that reported it.
        ref: { type: string }
        workflow: { type: string }
        run_id: { type: string }
        run_attempt: { type: string }

    DeploymentRecordListPayload:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeploymentRecord' }
        page: { $ref: '#/components/schemas/PageInfo' }

    DeploymentRecordListResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DeploymentRecordListPayload' }

    RepositoryAuthorizeRequest:
      type: object
      description: |
        Repository identity is never accepted here — it comes only from the
        verified workload OIDC token (spec §4.5), same rule as
        `BuildRegistration`'s token-derived fields.
      required: [challenge]
      additionalProperties: false
      properties:
        challenge:
          type: string
          description: |
            The single-use value issued by `POST /v1/orgs/{slug}/challenges`.
            Bearer secret — never logged, never written to disk by a
            conforming client.

    RepositoryAuthorization:
      type: object
      description: |
        Confirmation that a challenge was redeemed and the repository is now
        bound — not a full policy record (constraints, timestamps; see
        `Policy`/`listPolicies`, the dashboard-tier policy-management
        operations, DRFT-63).
      required: [repository_id, organization_id]
      properties:
        repository_id:
          type: string
          description: Provider's stable repository identifier, same identity space as `Build.repository_id`.
        organization_id: { type: string }

    RepositoryAuthorizationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RepositoryAuthorization' }

    # --- Challenges (DRFT-61) ----------------------------------------------
    #
    # Never carries the raw secret value except on ChallengeIssued, and only
    # there — createChallenge's response, once, per spec §4.5.
    Challenge:
      type: object
      required: [id, status, attempts, max_attempts, expires_at, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 80
          description: |
            Optional human label supplied at `createChallenge` time. Absent for
            challenges issued without one. Display-only — never an
            authorization input.
        status:
          type: string
          enum: [live, redeemed, revoked, expired]
          description: |
            Derived, not stored — see `model.Challenge.State()`. Does not
            reflect the attempt cap: a challenge that has hit `max_attempts`
            still reports `live` here until it also expires or is revoked
            (redemption itself is what enforces the cap; this field alone
            isn't sufficient to know whether a further redemption attempt
            would succeed).
        attempts:
          type: integer
          description: Failed redemption attempts against this challenge so far.
        max_attempts:
          type: integer
          description: |
            The cap `attempts` is counted against — past this, redemption
            rejects the challenge outright regardless of `status`/`expires_at`.
        redeemed_at:
          type: string
          format: date-time
        repository_path:
          type: string
          description: |
            `owner/repo` of the repository this challenge bound when it was
            redeemed. Present only on a `redeemed` challenge returned by
            `listChallenges`; absent on every other status and on
            `createChallenge`'s response. Resolved from the binding the
            redemption created, so it stays accurate for challenges redeemed
            before this field existed. It names the repository the challenge
            bound at the time — the binding may since have been revoked (see
            `listPolicies` for current state).
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: |
            Email of the person who issued this challenge, as it was when they
            did. The audit trail for who bootstrapped a pipeline: redeeming a
            challenge creates the repository's policy (`Policy.onboarded_by`).
            Absent for challenges issued before this was recorded.

    ChallengeIssued:
      allOf:
        - $ref: '#/components/schemas/Challenge'
        - type: object
          required: [value]
          properties:
            value:
              type: string
              description: |
                The raw, single-use challenge secret. Returned **only** by
                `createChallenge`, and only on that one response — never
                recoverable afterward, never present on `listChallenges`
                rows. Paste it into CI as `DRIFTMAPPER_CHALLENGE` before
                navigating away.

    ChallengeIssuedResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ChallengeIssued' }

    ChallengeListPayload:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Challenge' }
        page: { $ref: '#/components/schemas/PageInfo' }

    ChallengeListResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ChallengeListPayload' }

    CreateChallengeRequest:
      type: object
      description: |
        Optional body for `createChallenge`. Every field is optional so the
        pre-existing empty-body call shape keeps working unchanged.
      properties:
        name:
          type: string
          maxLength: 80
          description: |
            Human label for the challenge. The server trims surrounding
            whitespace and treats an empty result as "no name". Over 80
            characters (after trimming), or any control character, is a 422
            validation error.

    # --- Policy lifecycle (DRFT-63) ---------------------------------------
    #
    # A policy's own fields carry no repository/org identity: those are
    # immutable by construction (see UpdatePolicyRequest) and already known
    # to a caller acting on one row from PolicyListResponse.
    Policy:
      type: object
      required: [id, state, bound_at]
      properties:
        id:
          type: integer
          format: int64
        workflow:
          type: string
          description: |
            Bare workflow-filename constraint (e.g. `ci.yml`). Null means
            unconstrained — redemption's default policy leaves it unset.
        ref:
          type: string
          description: Git ref constraint (e.g. `refs/heads/main`). Null means unconstrained.
        environment:
          type: string
          description: |
            Deployment-environment constraint. Null means unconstrained; an
            empty string is a real constraint meaning "must target no
            environment" (spec §4.5).
        state:
          type: string
          enum: [live, revoked]
        onboarded_by:
          type: string
          description: |
            Email of the person who issued the challenge that bootstrapped this
            binding (`Challenge.created_by`), as it was then. Absent if unknown.
        bound_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    PolicyWithRepository:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          required: [repository_id, repository_path, provider]
          properties:
            repository_id: { type: string }
            repository_path: { type: string, description: '`owner/name` at time of binding.' }
            provider: { $ref: '#/components/schemas/Provider' }

    PolicyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PolicyWithRepository' }

    UpdatePolicyRequest:
      type: object
      description: |
        Full-replace on the three constrainable dimensions: omit a property
        or send it null to leave/set that dimension unconstrained, resubmit
        the current value for anything you're not changing. No
        `repository_id`/`issuer`/`org_id` property exists here — rebinding a
        policy to a different repository or org is a new challenge (DRFT-59/
        62), never an edit.
      additionalProperties: false
      properties:
        workflow: { type: string }
        ref: { type: string }
        environment: { type: string }

    Repository:
      type: object
      required: [repository_id, provider, path, visibility, linked_at]
      properties:
        repository_id: { type: string }
        provider: { $ref: '#/components/schemas/Provider' }
        path: { type: string, description: '`owner/name` at time of last build.' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        latest_build_instance_id: { type: string }
        linked_at: { type: string, format: date-time }

    RepositoryListPayload:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Repository' }
        page: { $ref: '#/components/schemas/PageInfo' }

    RepositoryListResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RepositoryListPayload' }

    # Org/OrgWithRole (below) are deliberately distinct from Organization
    # (further below): this pair is the bare membership-list shape behind
    # `POST /v1/orgs` and `GET /v1/orgs` (create + switcher), while
    # Organization is `GET /v1/orgs/{slug}/organization`'s billing/plan/
    # slot-usage shape for one already-resolved org. Same underlying table,
    # two different response contracts for two different callers.
    Org:
      type: object
      required: [id, slug, name, personal, created_at]
      properties:
        id:
          type: integer
          format: int64
        slug: { type: string }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's auto-created personal org.
        created_at: { type: string, format: date-time }

    OrgWithRole:
      type: object
      required: [id, slug, name, personal, created_at, role]
      properties:
        id:
          type: integer
          format: int64
        slug: { type: string }
        name: { type: string }
        personal:
          type: boolean
          description: True for the user's auto-created personal org.
        created_at: { type: string, format: date-time }
        role:
          type: string
          enum: [owner, admin, member]
          description: The caller's role in this organization.

    OrgResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Org' }

    OrgListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrgWithRole' }

    Membership:
      type: object
      required: [id, org_id, user_id, role, created_at]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        role: { type: string, enum: [owner, admin, member] }
        created_at: { type: string, format: date-time }

    MemberWithUser:
      allOf:
        - $ref: '#/components/schemas/Membership'
        - type: object
          required: [email]
          properties:
            email: { type: string }

    Group:
      type: object
      required: [id, name, description, built_in]
      properties:
        id: { type: string, description: 'Opaque WorkOS group id, or `everyone` for the built-in group.' }
        name: { type: string }
        description: { type: string }
        built_in: { type: boolean, description: 'True for Everyone, which cannot be renamed, deleted or have members added.' }

    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    GroupMember:
      type: object
      required: [user_id, email]
      properties:
        user_id: { type: integer, format: int64 }
        email: { type: string }

    GroupResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Group' }

    GroupsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Group' }

    GroupMembersResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }

    App:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    AppsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/App' }

    GroupApps:
      type: object
      required: [app_ids]
      properties:
        app_ids:
          type: array
          items: { type: integer, format: int64 }

    GroupAppsResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/GroupApps' }

    Invite:
      type: object
      required: [id, organization_id, email, state, expires_at]
      properties:
        id: { type: string, description: Opaque WorkOS invitation id. }
        organization_id: { type: string }
        email: { type: string }
        state: { type: string }
        expires_at: { type: string, description: ISO-8601, as reported by WorkOS. }

    OrgMembersPayload:
      type: object
      required: [members, invites]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberWithUser' }
        invites:
          type: array
          items: { $ref: '#/components/schemas/Invite' }

    OrgMembersResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/OrgMembersPayload' }

    InviteResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Invite' }

    Organization:
      type: object
      required: [organization_id, name, plan]
      properties:
        organization_id: { type: string }
        name: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        sso_enforced: { type: boolean }
        billing_enabled:
          type: boolean
          description: |
            Whether this environment has Stripe configured at all. False in
            local/test environments with no STRIPE_SECRET_KEY — a client
            should hide upgrade/manage-subscription UI entirely rather than
            show it and have every action 404.
        is_paid:
          type: boolean
          description: True once this org has an active (non-Solo) subscription.
        over_member_limit:
          type: boolean
          description: |
            True when the org has more members than its current plan allows
            (a Team org whose subscription lapsed, dropping it back to
            Solo's one-member cap). Existing members keep access; only new
            invites are blocked. Never blocks reads.
        has_annual:
          type: boolean
          description: |
            Whether an annual Team price is configured, so a client knows
            whether to offer an annual billing-interval option at all.

    CheckoutSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url]
          properties:
            url:
              type: string
              description: Hosted Stripe Checkout URL — navigate the whole page here, never render it in-app.

    PortalSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url]
          properties:
            url:
              type: string
              description: Hosted Stripe Customer Portal URL — navigate the whole page here, never render it in-app.

    OrganizationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Organization' }

    AdminResetOrgPlan:
      type: object
      description: One org's planned treatment within an `AdminResetPlan`.
      required: [workos_org_id, personal, action, reason]
      properties:
        org_id:
          type: integer
          format: int64
          nullable: true
          description: Null when this org has no local mirror row.
        workos_org_id: { type: string }
        slug: { type: string }
        personal: { type: boolean }
        action:
          type: string
          enum: [delete, unlink, skip]
          description: |
            `delete` removes the org entirely; `unlink` removes only this
            user's membership; `skip` blocks the *entire* reset — see
            `AdminResetPlan.blocked`.
        reason:
          type: string
          description: Human-readable explanation, always set.
        membership_id: { type: string }
        stripe_customer_id: { type: string }
        stripe_subscription_id: { type: string }

    AdminResetPlan:
      type: object
      description: |
        `adminPlanUserReset`'s full output — everything
        `adminExecuteUserReset` needs, and everything an operator should
        review before executing.
      required: [email, orgs, blocked]
      properties:
        email: { type: string }
        local_user_id:
          type: integer
          format: int64
          nullable: true
          description: Null when there is no local mirror row for this email.
        workos_user_id:
          type: string
          description: Empty when there is no WorkOS user for this email.
        orgs:
          type: array
          items: { $ref: '#/components/schemas/AdminResetOrgPlan' }
        blocked:
          type: boolean
          description: |
            True when at least one org's action is `skip` — `adminExecuteUserReset`
            refuses to run at all in that case.

    AdminResetPlanResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AdminResetPlan' }

    AdminResetStep:
      type: object
      description: One action `adminExecuteUserReset` took, or didn't reach.
      required: [description, status]
      properties:
        description: { type: string }
        status:
          type: string
          enum: [ok, skipped, failed, not_attempted]
          description: |
            `skipped` is an idempotent no-op (already gone). `not_attempted`
            means execution stopped at an earlier failed step before reaching
            this one.
        error: { type: string }

    AdminResetReport:
      type: object
      description: |
        `adminExecuteUserReset`'s full, ordered audit trail — everything an
        operator needs to see exactly what succeeded, what failed, and what
        wasn't reached.
      required: [steps, failed]
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/AdminResetStep' }
        failed:
          type: boolean
          description: True if any step's status is `failed`.

    AdminResetReportResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AdminResetReport' }

    PageInfo:
      type: object
      required: [has_more]
      properties:
        has_more: { type: boolean }
        next_cursor:
          type: string
          description: Present only when `has_more` is true.

    Error:
      type: object
      description: |
        The `error` half of the response envelope (see "Response envelope" above).
        Not RFC 9457 — a from-scratch shape matching what every `cmd/api` route
        actually emits (`internal/api/respond.go`'s `errorBody`).
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable identity of the error. Clients branch on this,
            never on `message`, which may be reworded without a version bump.
            Examples: `validation`, `unauthorized`, `forbidden`, `not_found`,
            `unknown_field`, `claim_mismatch`, `policy_revoked`, `no_live_policy`,
            `rate_limited`.
        message:
          type: string
          description: Human-readable, safe to display directly.
        details:
          type: object
          description: |
            Structured, error-specific fields a client can act on programmatically,
            shaped per `error.code`. Present only for errors that document a shape;
            absent otherwise. Two currently do: `claim_mismatch` (see
            `ClaimMismatchDetails`) and `rate_limited` (see `RateLimitDetails` —
            emitted generically by the service-layer rate limiter, so it can appear
            on any operation, not only the ones whose `429` is individually
            documented above).

            Deliberately not a `oneOf` of the two: `details` is one field shared by
            every error response, not a per-code branch point, and a new code may
            add its own shape later without a version bump (this document's
            additive-within-major rule).
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    ClaimMismatchDetails:
      type: object
      description: |
        `error.details` shape when `error.code` is `claim_mismatch`: a signature-
        valid token whose claims did not satisfy the repository's authorization
        policy.

        The mismatched field is named explicitly rather than returning a generic
        authentication failure. This is the single most likely point of first-run
        abandonment — a case-sensitive workflow filename mismatch is a well-
        documented source of setup friction in comparable systems (spec §4.5) —
        and a specific error is cheap to produce and turns a dead end into a
        one-line fix.
      required: [mismatched_claim, expected, actual]
      properties:
        mismatched_claim:
          type: string
          description: e.g. `workflow`, `ref`, `environment`.
        expected:
          type: string
          description: Value the policy requires.
        actual:
          type: string
          description: |
            Value from the verified token. Safe to echo: the caller demonstrably
            already holds this token.

    RateLimitDetails:
      type: object
      description: |
        `error.details` shape when `error.code` is `rate_limited`. Emitted
        generically from the service layer (`internal/api/respond.go`'s
        `respondServiceError`, matched via `errors.As` against
        `service.RateLimitError`) rather than by one specific handler, so this
        can appear on any operation whose 429 response isn't individually
        documented with its own details shape — see e.g. `redeemChallenge` and
        `createChallenge` above, which each have their own distinct limit but
        share this one details shape.
      required: [scope, limit, retry_after_seconds]
      properties:
        scope:
          type: string
          description: |
            Identifies which quota was exceeded (e.g. which limiter matched) —
            distinguishes this rate limit from any other the same account may
            be subject to elsewhere.
        limit:
          type: integer
          description: The quota that was exceeded.
        retry_after_seconds:
          type: integer
          description: |
            Matches the response's `Retry-After` header (RFC 9110 §10.2.3) — a
            fixed-window counter's true reset could be sooner than a full
            window, but that's a safe under-promise, never an over-promise a
            client would retry too early against.
